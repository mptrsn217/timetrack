<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Moonglare: a flat, graphic moon over water. Full-bleed so it also works as a maskable icon. -->
  <defs>
    <clipPath id="sky"><rect width="512" height="326"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#160b07"/>
  <!-- the glare: hard-edged rings stepping from deep orange out to the dark -->
  <g clip-path="url(#sky)">
    <circle cx="256" cy="224" r="214" fill="#2e1409"/>
    <circle cx="256" cy="224" r="170" fill="#5a220b"/>
    <circle cx="256" cy="224" r="130" fill="#a8400e"/>
    <circle cx="256" cy="224" r="94" fill="#e8a317"/>
  </g>
  <!-- the reflection: bold bars, yellow then orange, narrowing with depth -->
  <g>
    <rect x="162" y="344" width="188" height="16" rx="8" fill="#e8a317"/>
    <rect x="186" y="372" width="140" height="16" rx="8" fill="#d9660f"/>
    <rect x="210" y="400" width="92" height="16" rx="8" fill="#a8400e"/>
    <rect x="232" y="428" width="48" height="16" rx="8" fill="#5a220b"/>
  </g>
</svg>
