<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Moonglare: a hollow moon over a horizon, with its reflection broken on the water.
       Full-bleed so it also works as a maskable icon. -->
  <defs>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3f63e0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#ffffff"/>
  <circle cx="256" cy="196" r="84" fill="none" stroke="url(#moon)" stroke-width="18"/>
  <line x1="106" y1="311" x2="406" y2="311" stroke="#272063" stroke-width="8" stroke-linecap="round"/>
  <g stroke-width="10" stroke-linecap="round">
    <line x1="163.2" y1="332" x2="299.0" y2="332" stroke="#6b4fe6"/>
    <line x1="317.0" y1="332" x2="348.8" y2="332" stroke="#6b4fe6"/>
    <line x1="168.4" y1="350" x2="221.0" y2="350" stroke="#5d5ee6"/>
    <line x1="239.0" y1="350" x2="349.6" y2="350" stroke="#5d5ee6"/>
    <line x1="167.4" y1="368" x2="264.5" y2="368" stroke="#4f6fe4"/>
    <line x1="282.5" y1="368" x2="338.6" y2="368" stroke="#4f6fe4"/>
    <line x1="182.8" y1="386" x2="207.8" y2="386" stroke="#4c84e8"/>
    <line x1="225.8" y1="386" x2="281.9" y2="386" stroke="#4c84e8"/>
    <line x1="299.9" y1="386" x2="337.2" y2="386" stroke="#4c84e8"/>
    <line x1="189.9" y1="404" x2="245.0" y2="404" stroke="#6c9df0"/>
    <line x1="263.0" y1="404" x2="318.1" y2="404" stroke="#6c9df0"/>
    <line x1="215.9" y1="422" x2="300.1" y2="422" stroke="#9dbdf6"/>
  </g>
</svg>
