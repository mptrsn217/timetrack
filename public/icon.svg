<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Moonglare: a hollow moon over a horizon, with its reflection broken on the water.
       Full-bleed so it also works as a maskable icon. -->
  <defs>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3f63e0"/>
    </linearGradient>
    <linearGradient id="horizon" gradientUnits="userSpaceOnUse" x1="106" y1="0" x2="406" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#6d5ce8"/>
      <stop offset="1" stop-color="#3f63e0" stop-opacity=".25"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#ffffff"/>
  <circle cx="256" cy="196" r="84" fill="none" stroke="url(#moon)" stroke-width="18"/>
  <line x1="106" y1="311" x2="406" y2="311" stroke="url(#horizon)" stroke-width="8" stroke-linecap="round"/>
  <g stroke-width="10" stroke-linecap="round">
    <line x1="182.5" y1="332" x2="288.2" y2="332" stroke="#6b4fe6"/>
    <line x1="306.2" y1="332" x2="329.5" y2="332" stroke="#6b4fe6"/>
    <line x1="172.7" y1="350" x2="222.4" y2="350" stroke="#5d5ee6"/>
    <line x1="240.4" y1="350" x2="345.3" y2="350" stroke="#5d5ee6"/>
    <line x1="162.8" y1="368" x2="265.7" y2="368" stroke="#4f6fe4"/>
    <line x1="283.7" y1="368" x2="343.2" y2="368" stroke="#4f6fe4"/>
    <line x1="173.7" y1="386" x2="202.7" y2="386" stroke="#4c84e8"/>
    <line x1="220.7" y1="386" x2="285.5" y2="386" stroke="#4c84e8"/>
    <line x1="303.5" y1="386" x2="346.3" y2="386" stroke="#4c84e8"/>
    <line x1="180.5" y1="404" x2="245.0" y2="404" stroke="#6c9df0"/>
    <line x1="263.0" y1="404" x2="327.5" y2="404" stroke="#6c9df0"/>
    <line x1="213.5" y1="422" x2="302.5" y2="422" stroke="#9dbdf6"/>
  </g>
</svg>
