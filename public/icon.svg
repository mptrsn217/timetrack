<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Moonglare: the moon over still water, as in the startup animation. Full-bleed so it also works as a maskable icon. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0712"/>
      <stop offset=".63" stop-color="#2a1a3a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c1e"/>
      <stop offset="1" stop-color="#07040c"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="222" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2b35e" stop-opacity=".5"/>
      <stop offset=".4" stop-color="#f2b35e" stop-opacity=".14"/>
      <stop offset="1" stop-color="#f2b35e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx=".4" cy=".36" r=".72">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".55" stop-color="#fbe9cc"/>
      <stop offset="1" stop-color="#f2c586"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b35e" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fbe9cc" stop-opacity=".75"/>
      <stop offset="1" stop-color="#f2b35e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="222" r="190" fill="url(#glow)"/>
  <circle cx="256" cy="222" r="74" fill="url(#moon)"/>
  <rect y="322" width="512" height="190" fill="url(#water)"/>
  <rect x="96" y="321" width="320" height="2" fill="url(#horizon)"/>
  <!-- the reflection: glints that narrow and fade with depth -->
  <g stroke="#fbe9cc" stroke-linecap="round" stroke-width="6">
    <line x1="196" y1="344" x2="316" y2="344" stroke-opacity=".85"/>
    <line x1="208" y1="364" x2="304" y2="364" stroke-opacity=".62"/>
    <line x1="220" y1="384" x2="292" y2="384" stroke-opacity=".44"/>
    <line x1="231" y1="404" x2="281" y2="404" stroke-opacity=".3"/>
    <line x1="241" y1="424" x2="271" y2="424" stroke-opacity=".18"/>
  </g>
</svg>
