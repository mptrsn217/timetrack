<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timetrack</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#22262e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #22262e; --panel: #2c313b; --line: #3b414d;
    --ink: #ecebe4; --muted: #9aa0ab; --run: #d7a43b; --danger: #d9534f;
    box-sizing: border-box;
  }
  * { box-sizing: inherit; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  header h1 { font-size: 15px; font-weight: 500; color: var(--muted); margin: 0; }
  header nav button { padding: 8px 12px; border-radius: 8px; color: var(--muted); }
  header nav button[aria-pressed="true"] { background: var(--panel); color: var(--ink); }

  .hero { border-radius: 16px; padding: 20px; margin-bottom: 16px; background: var(--panel);
    min-height: 118px; display: flex; flex-direction: column; justify-content: space-between; }
  .hero.on { background: var(--run); color: #1d1a10; }
  .hero .name { font-size: 18px; font-weight: 600; }
  .hero .idle { color: var(--muted); }
  .hero .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .hero .clock { font-size: 52px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .hero .stop { background: #1d1a10; color: var(--run); padding: 12px 20px; border-radius: 10px; font-weight: 600; }

  .list { display: grid; gap: 10px; }
  .act { display: grid; grid-template-columns: 6px 1fr auto; gap: 14px; align-items: center;
    width: 100%; text-align: left; padding: 16px; border-radius: 14px; background: var(--panel); min-height: 68px; }
  .act:active { transform: scale(.985); }
  .act .swatch { width: 6px; height: 100%; min-height: 36px; border-radius: 3px; }
  .act .name { font-size: 18px; font-weight: 600; }
  .act .sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .act .now { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--run); }
  .act.on { box-shadow: inset 0 0 0 2px var(--run); }

  .manage .act { grid-template-columns: 44px 1fr auto; }
  .manage input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    padding: 10px; border-radius: 8px; font-size: 16px; }
  .manage input[type=color] { width: 44px; height: 44px; border: 0; background: none; padding: 0; border-radius: 8px; }
  .manage .tools { display: flex; gap: 4px; }
  .manage .tools button { padding: 10px; border-radius: 8px; color: var(--muted); }
  .manage .tools button.del { color: var(--danger); }
  .add { display: flex; gap: 8px; margin-top: 12px; }
  .add input { flex: 1; }
  .add .save { background: var(--run); color: #1d1a10; padding: 0 16px; border-radius: 8px; font-weight: 600; }

  .hist { display: grid; gap: 6px; }
  .hist .day { color: var(--muted); font-size: 13px; margin: 14px 0 4px; }
  .hist .e { display: grid; grid-template-columns: 6px 1fr auto auto; gap: 12px; align-items: center;
    padding: 10px 12px; border-radius: 10px; background: var(--panel); }
  .hist .e .sw { width: 6px; height: 28px; border-radius: 3px; }
  .hist .e .t { color: var(--muted); font-size: 13px; }
  .hist .e .d { font-variant-numeric: tabular-nums; font-weight: 600; }
  .hist .e .x { color: var(--muted); padding: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 12px; }
  .foot { margin-top: 20px; display: flex; gap: 14px; justify-content: center; }
  .foot button, .foot a { color: var(--muted); font-size: 13px; text-decoration: none; }
  #err { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    background: var(--danger); color: #fff; padding: 12px; border-radius: 10px; display: none; }
  .login { display: grid; justify-items: center; gap: 18px; padding: 48px 0; text-align: center; }
  .login h2 { margin: 0; font-size: 26px; }
  .login p { margin: 0; color: var(--muted); max-width: 320px; }
  .login .fine { font-size: 12px; }
  .login a { color: var(--muted); }
  .who { color: var(--muted); font-size: 13px; text-align: center; margin-top: 16px; }
  body.out header nav, body.out .foot, body.out .who { display: none; }
  @media (prefers-reduced-motion: reduce) { .act:active { transform: none; } }
</style>
</head>
<body class="out">
<main>
  <header>
    <h1>Timetrack</h1>
    <nav>
      <button data-view="track" aria-pressed="true">Track</button>
      <button data-view="history">History</button>
      <button data-view="manage">Edit</button>
    </nav>
  </header>
  <div id="app"></div>
  <div class="foot">
    <button id="notif">Enable lock-screen timer</button>
    <a href="#" id="csv">Export CSV</a>
    <button id="logout">Sign out</button>
    <button id="delacct">Delete account</button>
  </div>
  <div class="who" id="who"></div>
</main>
<div id="err"></div>
<script src="https://accounts.google.com/gsi/client" async></script>

<script>
const $ = (s) => document.querySelector(s);
const app = $("#app");
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
let signedIn = false;
let state = { activities: [], running: null, totals: [] };
let view = "track";
let offset = 0; // serverNow - clientNow ms
let entries = [];

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, {
    ...opts,
    headers: { "content-type": "application/json", ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 401) { signedIn = false; render(); throw new Error("Please sign in"); }
  if (!r.ok) throw new Error((await r.json()).error || r.statusText);
  return r.json();
}
function toast(msg) { const e = $("#err"); e.textContent = msg; e.style.display = "block"; setTimeout(() => e.style.display = "none", 3000); }
function now() { return Date.now() + offset; }
function fmt(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
function fmtShort(sec) {
  const h = Math.floor(sec / 3600), m = Math.round(sec % 3600 / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}
function runSec() { return state.running ? (now() - new Date(state.running.started_at)) / 1000 : 0; }
function total(id, key) {
  const t = state.totals.find((x) => x.activity_id === id);
  return t ? Number(t[key]) : 0;
}

async function load() {
  try {
    const s = await api(`/state?tz=${encodeURIComponent(tz)}`);
    offset = new Date(s.serverNow) - Date.now();
    state = s;
    signedIn = true;
    if (view === "history") entries = await api("/entries?days=14");
    render();
  } catch (e) { if (signedIn) toast(e.message); render(); }
}

async function start(id) {
  try { await api("/start", { method: "POST", body: { activity_id: id } }); await load(); notify(); }
  catch (e) { toast(e.message); }
}
async function stop() {
  try { await api("/stop", { method: "POST" }); await load(); notify(); }
  catch (e) { toast(e.message); }
}

function render() {
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === view));
  document.body.classList.toggle("out", !signedIn);
  if (!signedIn) return renderLogin();
  const u = state.user;
  $("#who").textContent = u ? `Signed in as ${u.email}` : "";
  if (view === "track") renderTrack();
  else if (view === "manage") renderManage();
  else renderHistory();
}

let googleClientId = null;
async function renderLogin() {
  app.innerHTML = `<div class="login">
    <h2>Timetrack</h2>
    <p>One tap to start a timer, one tap to stop. See where your day goes.</p>
    <div id="gbtn"></div>
    <p class="fine">Your data is private to your account. <a href="/privacy.html">Privacy</a></p></div>`;
  try {
    if (googleClientId === null) googleClientId = (await fetch("/config").then((r) => r.json())).googleClientId;
    if (!googleClientId) return toast("Sign-in is not configured on the server");
    await new Promise((ok) => (function wait() { window.google?.accounts?.id ? ok() : setTimeout(wait, 50); })());
    google.accounts.id.initialize({ client_id: googleClientId, callback: onGoogle });
    google.accounts.id.renderButton($("#gbtn"), { theme: "filled_black", size: "large", shape: "pill", text: "continue_with" });
  } catch (e) { toast("Could not load Google sign-in"); }
}
async function onGoogle({ credential }) {
  const r = await fetch("/auth/google", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ credential }) });
  if (!r.ok) return toast((await r.json().catch(() => ({}))).error || "Sign-in failed");
  view = "track";
  load();
}

function renderTrack() {
  const r = state.running;
  const total_today = state.totals.reduce((a, t) => a + Number(t.today), 0);
  const hero = r
    ? `<div class="hero on"><div class="name">${esc(r.name)}</div>
       <div class="row"><div class="clock" id="clock">${fmt(runSec())}</div><button class="stop" id="stopbtn">Stop</button></div></div>`
    : `<div class="hero"><div class="idle">Nothing running</div>
       <div class="row"><div class="clock">${fmtShort(total_today)}</div><div class="idle">today</div></div></div>`;
  const list = state.activities.length
    ? state.activities.map((a) => {
        const on = r && r.activity_id === a.id;
        return `<button class="act ${on ? "on" : ""}" data-id="${a.id}">
          <span class="swatch" style="background:${a.color}"></span>
          <span><div class="name">${esc(a.name)}</div>
          <div class="sub">${fmtShort(total(a.id, "today"))} today · ${fmtShort(total(a.id, "week"))} this week</div></span>
          <span class="now">${on ? `<span class="tick">${fmt(runSec())}</span>` : ""}</span></button>`;
      }).join("")
    : `<div class="empty">No activities yet. Add them under Edit.</div>`;
  app.innerHTML = hero + `<div class="list">${list}</div>`;
  if (r) $("#stopbtn").onclick = stop;
  app.querySelectorAll(".act").forEach((b) => b.onclick = () => (r && r.activity_id == b.dataset.id) ? stop() : start(Number(b.dataset.id)));
}

function renderManage() {
  app.innerHTML = `<div class="manage"><div class="list">${state.activities.map((a, i) => `
    <div class="act" data-id="${a.id}">
      <input type="color" value="${a.color}">
      <input type="text" value="${esc(a.name)}">
      <span class="tools">
        <button class="up" ${i === 0 ? "disabled" : ""} title="Move up">▲</button>
        <button class="del" title="Delete">✕</button>
      </span></div>`).join("")}</div>
    <div class="add"><input type="text" id="newname" placeholder="New activity">
      <input type="color" id="newcolor" value="${randColor()}"><button class="save" id="addbtn">Add</button></div></div>`;
  $("#addbtn").onclick = async () => {
    const name = $("#newname").value; if (!name.trim()) return;
    try { await api("/activities", { method: "POST", body: { name, color: $("#newcolor").value } }); await load(); } catch (e) { toast(e.message); }
  };
  $("#newname").onkeydown = (e) => e.key === "Enter" && $("#addbtn").click();
  app.querySelectorAll(".act").forEach((row, i) => {
    const id = row.dataset.id;
    row.querySelector("input[type=text]").onchange = (e) => api(`/activities/${id}`, { method: "PUT", body: { name: e.target.value } }).then(load).catch((e) => toast(e.message));
    row.querySelector("input[type=color]").onchange = (e) => api(`/activities/${id}`, { method: "PUT", body: { color: e.target.value } }).then(load).catch((e) => toast(e.message));
    row.querySelector(".del").onclick = () => { if (confirm("Delete activity? Its history is kept.")) api(`/activities/${id}`, { method: "DELETE" }).then(load); };
    row.querySelector(".up").onclick = async () => {
      const a = state.activities, me = a[i], prev = a[i - 1];
      await Promise.all([
        api(`/activities/${me.id}`, { method: "PUT", body: { sort: i - 1 } }),
        api(`/activities/${prev.id}`, { method: "PUT", body: { sort: i } }),
      ]);
      // normalise to avoid ties
      await Promise.all(a.map((x, k) => k === i || k === i - 1 ? null : api(`/activities/${x.id}`, { method: "PUT", body: { sort: k } })));
      load();
    };
  });
}

function renderHistory() {
  if (!entries.length) { app.innerHTML = `<div class="empty">No entries in the last 14 days.</div>`; return; }
  let html = `<div class="hist">`, lastDay = "";
  for (const e of entries) {
    const s = new Date(e.started_at), day = s.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
    if (day !== lastDay) { html += `<div class="day">${day}</div>`; lastDay = day; }
    const end = e.stopped_at ? new Date(e.stopped_at) : null;
    const dur = ((end ? end.getTime() : now()) - s) / 1000;
    const t = (d) => d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    html += `<div class="e"><span class="sw" style="background:${e.color}"></span>
      <span><div>${esc(e.name)}</div><div class="t">${t(s)} – ${end ? t(end) : "now"}</div></span>
      <span class="d">${fmtShort(dur)}</span><button class="x" data-id="${e.id}" title="Delete">✕</button></div>`;
  }
  app.innerHTML = html + `</div>`;
  app.querySelectorAll(".x").forEach((b) => b.onclick = () => { if (confirm("Delete entry?")) api(`/entries/${b.dataset.id}`, { method: "DELETE" }).then(load); });
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function randColor() { return ["#d7a43b", "#5b9bd5", "#7cb342", "#e07a5f", "#9b7bd6", "#4fb3a3", "#e2b8a4"][Math.floor(Math.random() * 7)]; }

// live tick
setInterval(() => {
  if (!state.running) return;
  const v = fmt(runSec());
  const c = $("#clock"); if (c) c.textContent = v;
  document.querySelectorAll(".tick").forEach((e) => e.textContent = v);
}, 1000);
setInterval(load, 30000);
document.addEventListener("visibilitychange", () => !document.hidden && load());

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => { view = b.dataset.view; load(); });
$("#logout").onclick = async () => {
  await stopNotify();
  await fetch("/auth/logout", { method: "POST" });
  window.google?.accounts?.id?.disableAutoSelect();
  signedIn = false; state = { activities: [], running: null, totals: [] }; render();
};
$("#delacct").onclick = async () => {
  if (!confirm("Delete your account and all tracked time? This cannot be undone.")) return;
  try { await api("/me", { method: "DELETE" }); } catch (e) { return toast(e.message); }
  await stopNotify();
  signedIn = false; state = { activities: [], running: null, totals: [] }; render();
};
$("#csv").onclick = async (e) => {
  e.preventDefault();
  const r = await fetch("/api/export.csv");
  if (!r.ok) return toast("Export failed");
  const url = URL.createObjectURL(await r.blob());
  Object.assign(document.createElement("a"), { href: url, download: "timetrack.csv" }).click();
};

// notifications (persistent timer in shade / lock screen on Android)
let swReg = null;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").then((r) => swReg = r);
$("#notif").onclick = async () => {
  if (!("Notification" in window)) return toast("Notifications not supported here");
  const p = await Notification.requestPermission();
  toast(p === "granted" ? "Enabled" : "Not allowed");
  notify();
};
async function stopNotify() {
  if (!swReg) return;
  (await swReg.getNotifications({ tag: "running" })).forEach((n) => n.close());
}
async function notify() {
  if (!swReg || Notification.permission !== "granted") return;
  await stopNotify();
  if (!state.running) return;
  swReg.showNotification(state.running.name, {
    tag: "running", body: "Running since " + new Date(state.running.started_at).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }),
    silent: true, requireInteraction: true, icon: "/icon-192.png",
    actions: [{ action: "stop", title: "Stop" }],
  });
}
navigator.serviceWorker?.addEventListener("message", (e) => e.data === "reload" && load());

load();
</script>
</body>
</html>
