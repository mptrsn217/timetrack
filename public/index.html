<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timetrack</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131519" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efeee9; --line: #e4e2dc;
    --ink: #1a1c21; --muted: #6c707a; --faint: #a3a6ad;
    --accent: #d8920f; --accent-ink: #1a1405; --danger: #d0453f;
    --shadow: 0 1px 2px rgba(20, 20, 30, .05), 0 4px 16px rgba(20, 20, 30, .05);
    --radius: 18px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131519; --surface: #1c1f25; --surface-2: #252932; --line: #2c3039;
      --ink: #eef0f3; --muted: #8e94a0; --faint: #5d626d;
      --accent: #f2b33d; --accent-ink: #1a1405; --danger: #ef6a63;
      --shadow: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  svg { display: block; }

  /* shell */
  .top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; }
  .top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .brand .mark { width: 28px; height: 28px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); overflow: hidden;
    display: grid; place-items: center; font-weight: 700; color: var(--muted); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  main { max-width: 560px; margin: 0 auto; padding: 8px 16px calc(96px + env(safe-area-inset-bottom)); }
  h2.section { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
    margin: 26px 4px 10px; display: flex; justify-content: space-between; }
  h2.section span:last-child { text-transform: none; letter-spacing: 0; font-weight: 500; }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface);
    border-top: 1px solid var(--line); padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); }
  .tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  .tabs button { display: grid; justify-items: center; gap: 2px; padding: 6px 0; color: var(--faint); font-size: 12px; font-weight: 600; }
  .tabs button[aria-current="page"] { color: var(--ink); }
  .tabs button[aria-current="page"] svg { color: var(--accent); }
  body.out .tabs, body.out .avatar { display: none; }

  /* hero */
  .hero { position: relative; overflow: hidden; border-radius: 24px; padding: 20px; background: var(--surface);
    box-shadow: var(--shadow); min-height: 168px; display: flex; flex-direction: column; justify-content: space-between; }
  .hero.on { background: color-mix(in srgb, var(--c) 16%, var(--surface)); }
  .hero .label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 600; }
  .hero .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--c); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .hero .name { font-size: 22px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .hero .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 18px; }
  .hero .clock { font-size: clamp(44px, 14vw, 60px); font-weight: 750; letter-spacing: -.03em; line-height: 1; }
  .hero .since { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .btn-stop { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg);
    padding: 14px 20px; border-radius: 999px; font-weight: 700; flex-shrink: 0; }
  .btn-stop:active { transform: scale(.97); }

  .daybar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin-top: 16px; gap: 2px; }
  .daybar span { background: var(--c); min-width: 3px; }

  /* activity tiles */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { position: relative; text-align: left; padding: 16px; border-radius: var(--radius); background: var(--surface);
    box-shadow: var(--shadow); min-height: 104px; display: flex; flex-direction: column; justify-content: space-between;
    transition: transform .12s ease, background .2s ease; }
  .tile:active { transform: scale(.97); }
  .tile .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .tile .nm { font-weight: 650; font-size: 16px; margin-top: 14px; overflow-wrap: anywhere; line-height: 1.25; }
  .tile .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .tile.on { background: color-mix(in srgb, var(--c) 18%, var(--surface)); box-shadow: inset 0 0 0 2px var(--c); }
  .tile.on .sub { color: var(--ink); font-weight: 600; }
  .tile .play { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
  .tile.on .play { background: var(--c); color: #fff; }

  .empty { text-align: center; padding: 36px 20px; color: var(--muted); background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent);
    color: var(--accent-ink); padding: 12px 18px; border-radius: 12px; font-weight: 700; margin-top: 14px; }
  .btn:disabled { opacity: .45; cursor: default; }

  /* cards / lists */
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .card + .card { margin-top: 10px; }
  .rowi { display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center; padding: 13px 14px; }
  .rowi + .rowi { border-top: 1px solid var(--line); }
  .rowi .bar { width: 4px; height: 32px; border-radius: 4px; background: var(--c); justify-self: center; }
  .rowi .t { color: var(--muted); font-size: 13px; }
  .rowi .d { font-weight: 650; }
  .rowi .right { display: flex; align-items: center; gap: 4px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--faint); }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn:disabled { opacity: .3; pointer-events: none; }

  .wk { padding: 14px; display: grid; gap: 12px; }
  .wk .l { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .wk .l span:last-child { color: var(--muted); }
  .wk .track { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .wk .fill { height: 100%; background: var(--c); border-radius: 99px; }

  /* edit */
  .field { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: 12px;
    padding: 12px 14px; font-size: 16px; min-width: 0; }
  .field:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .addbox { padding: 14px; }
  .addrow { display: flex; gap: 8px; }
  .addrow .btn { margin-top: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; background: var(--c); position: relative; }
  .sw[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--c); }
  .editrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 10px 10px 14px; }
  .editrow + .editrow { border-top: 1px solid var(--line); }
  .editrow .field { background: transparent; padding: 10px; }
  .editrow .field:focus { background: var(--surface-2); }
  .colorbtn { width: 32px; height: 32px; border-radius: 50%; background: var(--c); position: relative; overflow: hidden; }
  .colorbtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: 0; padding: 0; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 4px 0; }

  /* history */
  .day { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 4px 8px; }
  .day b { font-size: 15px; }
  .day span { color: var(--muted); font-size: 14px; }

  /* login */
  .login { min-height: calc(100vh - 140px); display: grid; align-content: center; justify-items: center; text-align: center; gap: 16px; padding: 24px 0; }
  .login .mark { width: 64px; height: 64px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .login h1 { margin: 6px 0 0; font-size: 32px; letter-spacing: -.02em; }
  .login p { margin: 0; color: var(--muted); max-width: 300px; }
  .login .demo { display: grid; gap: 8px; width: 100%; max-width: 300px; margin: 12px 0; }
  .login .demo div { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; font-size: 15px; }
  .login .demo i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .login .demo em { margin-left: auto; font-style: normal; color: var(--muted); font-weight: 500; }
  .login .fine { font-size: 12px; color: var(--faint); }
  .login a { color: inherit; }
  #gbtn { min-height: 44px; }

  /* sheet */
  dialog { border: 0; padding: 0; background: var(--surface); color: var(--ink); border-radius: 24px 24px 0 0;
    width: 100%; max-width: 560px; margin: auto auto 0; box-shadow: 0 -8px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10, 12, 16, .45); }
  .sheet { padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 14px; }
  .sheet .who { display: flex; align-items: center; gap: 12px; padding: 4px 4px 14px; }
  .sheet .who .avatar { width: 44px; height: 44px; }
  .sheet .who div div:last-child { color: var(--muted); font-size: 14px; }
  .menu button, .menu a { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 8px; border-radius: 12px;
    text-align: left; color: var(--ink); text-decoration: none; font-weight: 550; }
  .menu button:hover, .menu a:hover { background: var(--surface-2); }
  .menu svg { color: var(--muted); }
  .menu .danger, .menu .danger svg { color: var(--danger); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

  /* daily chart */
  .chart { position: relative; padding: 16px 14px 12px; overflow: visible; }
  .plot { position: relative; margin: 6px 0 44px 30px; }
  .gl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .gl span { position: absolute; right: 100%; transform: translateY(-50%); padding-right: 6px; font-size: 11px; color: var(--faint); }
  .cols { position: absolute; left: 0; right: 0; bottom: -34px; top: 0; display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }
  .col { display: flex; flex-direction: column; align-items: center; min-width: 0; border-radius: 6px; }
  .col .stack { width: 100%; display: flex; align-items: flex-end; justify-content: center; border-radius: 6px; }
  .col .segs { width: min(100%, 18px); display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 4px 4px 0 0; overflow: hidden; }
  .col .segs span { background: var(--c); min-height: 2px; flex-shrink: 0; }
  .col .xl { display: grid; justify-items: center; margin-top: 6px; font-size: 10px; line-height: 1.25; color: var(--faint); }
  .col .xl b { font-weight: 600; color: var(--muted); }
  .col.today .xl, .col.today .xl b { color: var(--ink); }
  .col.sel .stack { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .lg { display: inline-flex; align-items: center; gap: 6px; }
  .lg i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .tip { position: absolute; top: 8px; z-index: 3; min-width: 170px; max-width: 240px; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.18); font-size: 13px; pointer-events: none; }
  .tip .th { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; color: var(--muted); }
  .tip .th b { color: var(--ink); }
  .tip .tr { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 2px 0; }
  .tip .tr i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .tip .tr.muted { display: block; color: var(--muted); }

  /* entry rows + editor */
  button.rowi { width: 100%; text-align: left; }
  button.rowi:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
  .rowi .chev { color: var(--faint); width: 28px; display: grid; place-items: center; }
  .sheet h3 { margin: 0 4px 14px; font-size: 18px; }
  .eform { display: grid; gap: 12px; }
  .eform label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .eform .field { color: var(--ink); font-weight: 500; min-height: 48px; }
  .eform select.field { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  .edur { margin: 0 4px; color: var(--muted); font-size: 14px; }
  .edur.bad { color: var(--danger); }
  .eactions { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; margin-top: 4px; }
  .eactions .btn { margin-top: 0; }
  .btn.ghost { background: var(--surface-2); color: var(--ink); }
  .btn.ghost.danger { color: var(--danger); }

  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 20;
    max-width: 420px; margin: 0 auto; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px;
    font-weight: 550; text-align: center; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
  #toast.show { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .tile:active, .btn-stop:active { transform: none; }
  }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></symbol>

  <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="mark"><svg width="17" height="17"><use href="#i-clock"/></svg></span>Timetrack</div>
    <button class="avatar" id="me" aria-label="Account"></button>
  </div>
</header>
<main id="app"></main>
<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button data-view="track"><svg width="24" height="24"><use href="#i-clock"/></svg>Track</button>
    <button data-view="history"><svg width="24" height="24"><use href="#i-list"/></svg>History</button>
    <button data-view="manage"><svg width="24" height="24"><use href="#i-grid"/></svg>Activities</button>
  </div>
</nav>

<dialog id="sheet">
  <div class="sheet">
    <div class="grab"></div>
    <div class="who"><span class="avatar" id="sheet-av"></span><div><div id="sheet-name"></div><div id="sheet-email"></div></div></div>
    <div class="menu">
      <button id="notif"><svg width="22" height="22"><use href="#i-bell"/></svg>Lock-screen timer (Android)</button>
      <button id="csv"><svg width="22" height="22"><use href="#i-dl"/></svg>Export CSV</button>
      <a href="/privacy.html"><svg width="22" height="22"><use href="#i-shield"/></svg>Privacy</a>
      <hr>
      <button id="logout"><svg width="22" height="22"><use href="#i-out"/></svg>Sign out</button>
      <button id="delacct" class="danger"><svg width="22" height="22"><use href="#i-trash"/></svg>Delete account</button>
    </div>
  </div>
</dialog>
<dialog id="editsheet"><div class="sheet"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://accounts.google.com/gsi/client" async></script>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $("#app");
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
// validated categorical order: adjacent pairs stay distinguishable for colorblind users on light and dark
const PALETTE = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"];
let signedIn = false;
let state = { activities: [], running: null, totals: [], user: null };
let view = "track";
let offset = 0; // serverNow - clientNow ms
let entries = [];
let newColor = null; // user-picked color for the next activity; null = next unused palette slot

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, {
    ...opts,
    headers: { "content-type": "application/json", ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 401) { signedIn = false; render(); throw new Error("Please sign in"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
let toastTimer;
function toast(msg) {
  const e = $("#toast"); e.textContent = msg; e.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove("show"), 2800);
}
function now() { return Date.now() + offset; }
function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
function fmtShort(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}
const clock = (d) => new Date(d).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
function runSec() { return state.running ? (now() - new Date(state.running.started_at)) / 1000 : 0; }
// server totals are a snapshot; add the time elapsed since then for the running activity
let loadedAt = Date.now();
function total(id, key) {
  const t = state.totals.find((x) => x.activity_id === id);
  let v = t ? Number(t[key]) : 0;
  if (state.running?.activity_id === id) v += (Date.now() - loadedAt) / 1000;
  return v;
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (id, size = 20) => `<svg width="${size}" height="${size}"><use href="#i-${id}"/></svg>`;
const editing = () => app.contains(document.activeElement) && document.activeElement.matches("input");

async function load({ background = false } = {}) {
  try {
    const s = await api(`/state?tz=${encodeURIComponent(tz)}`);
    offset = new Date(s.serverNow) - Date.now();
    loadedAt = Date.now();
    state = s;
    signedIn = true;
    if (view === "history") entries = await api("/entries?days=14");
    // never redraw under someone's fingers: a background refresh would wipe what they are typing
    if (background && editing()) return;
    render();
  } catch (e) { if (signedIn && !background) toast(e.message); if (!signedIn) render(); }
}

function render() {
  document.body.classList.toggle("out", !signedIn);
  $$(".tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false"));
  if (!signedIn) return renderLogin();
  renderAvatar($("#me"));
  if (view === "track") renderTrack();
  else if (view === "manage") renderManage();
  else renderHistory();
}

function renderAvatar(el) {
  const u = state.user || {};
  const initial = (u.name || u.email || "?").trim()[0].toUpperCase();
  el.innerHTML = u.picture ? `<img src="${esc(u.picture)}" alt="" referrerpolicy="no-referrer">` : esc(initial);
}

async function start(id) {

/* ---------- history ---------- */
const DAYS = 14;
const dayStart = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const entryEnd = (e) => (e.stopped_at ? new Date(e.stopped_at).getTime() : now());
const dur = (e) => (entryEnd(e) - new Date(e.started_at)) / 1000;

// seconds per activity per calendar day, splitting entries that cross midnight
function dailyTotals() {
  const first = addDays(dayStart(new Date()), -(DAYS - 1));
  const days = Array.from({ length: DAYS }, (_, i) => ({ date: addDays(first, i), by: new Map(), total: 0 }));
  for (const e of entries) {
    const s = new Date(e.started_at).getTime(), end = entryEnd(e);
    for (const d of days) {
      const a = d.date.getTime(), b = addDays(d.date, 1).getTime();
      const v = (Math.min(end, b) - Math.max(s, a)) / 1000;
      if (v > 0) { d.by.set(e.activity_id, (d.by.get(e.activity_id) || 0) + v); d.total += v; }
    }
  }
  return days;
}

// activities that appear in the data, in the user's own order (archived ones last)
function chartSeries() {
  const seen = new Map();
  for (const e of entries) if (!seen.has(e.activity_id)) seen.set(e.activity_id, { id: e.activity_id, name: e.name, color: e.color });
  const order = state.activities.map((a) => a.id);
  const rank = (id) => (order.includes(id) ? order.indexOf(id) : 1e6 + id);
  return [...seen.values()].map((s) => ({ ...s, ...(state.activities.find((a) => a.id === s.id) || {}) }))
    .sort((a, b) => rank(a.id) - rank(b.id));
}

function niceStepHours(maxH) {
  for (const s of [0.5, 1, 2, 3, 4, 6, 8, 12]) if (maxH / s <= 4) return s;
  return 24;
}

function renderDaily() {
  const days = dailyTotals();
  const series = chartSeries();
  const maxH = Math.max(1, ...days.map((d) => d.total / 3600));
  const step = niceStepHours(maxH);
  const top = Math.ceil(maxH / step) * step;
  const H = 150;
  const ticks = [];
  for (let t = 0; t <= top + 1e-9; t += step) ticks.push(t);
  const todayKey = dayStart(new Date()).getTime();
  const active = days.filter((d) => d.total > 0);
  const avg = active.length ? active.reduce((s, d) => s + d.total, 0) / active.length : 0;

  const bars = days.map((d, i) => {
    const segs = series.filter((s) => d.by.get(s.id) > 0)
      .map((s) => `<span style="--c:${s.color};height:${(d.by.get(s.id) / 3600 / top) * H}px"></span>`).join("");
    const isToday = d.date.getTime() === todayKey;
    const wd = d.date.toLocaleDateString(undefined, { weekday: "narrow" });
    const label = d.date.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" });
    return `<button class="col${isToday ? " today" : ""}" data-day="${i}" aria-label="${esc(label)}: ${fmtShort(d.total)}">
      <span class="stack" style="height:${H}px">${segs ? `<span class="segs">${segs}</span>` : ""}</span>
      <span class="xl"><b>${wd}</b>${d.date.getDate()}</span></button>`;
  }).join("");

  const grid = ticks.map((t) => `<div class="gl" style="bottom:${(t / top) * H}px"><span>${t ? (t % 1 ? `${t * 60}m` : `${t}h`) : ""}</span></div>`).join("");
  const legend = series.map((s) => `<span class="lg" style="--c:${s.color}"><i></i>${esc(s.name)}</span>`).join("");

  return `<h2 class="section"><span>Daily</span><span class="num">${avg ? `avg ${fmtShort(avg)} / day` : ""}</span></h2>
    <div class="card chart">
      <div class="plot" style="height:${H}px">${grid}<div class="cols">${bars}</div></div>
      ${series.length ? `<div class="legend">${legend}</div>` : ""}
      <div class="tip" id="tip" hidden></div>
    </div>`;
}

function bindDaily() {
  const days = dailyTotals(), series = chartSeries();
  const tip = $("#tip"), chart = $(".chart");
  if (!tip) return;
  let pinned = null;
  const show = (btn) => {
    const d = days[btn.dataset.day];
    const rows = series.filter((s) => d.by.get(s.id) > 0).reverse()
      .map((s) => `<div class="tr" style="--c:${s.color}"><i></i><span>${esc(s.name)}</span><b class="num">${fmtShort(d.by.get(s.id))}</b></div>`).join("");
    tip.innerHTML = `<div class="th"><span>${d.date.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })}</span><b class="num">${fmtShort(d.total)}</b></div>${rows || `<div class="tr muted">Nothing tracked</div>`}`;
    tip.hidden = false;
    $$(".col", chart).forEach((c) => c.classList.toggle("sel", c === btn));
    const cr = chart.getBoundingClientRect(), br = btn.getBoundingClientRect();
    const w = tip.offsetWidth;
    tip.style.left = `${Math.min(Math.max(br.left - cr.left + br.width / 2 - w / 2, 8), cr.width - w - 8)}px`;
  };
  const hide = () => { tip.hidden = true; $$(".col", chart).forEach((c) => c.classList.remove("sel")); };
  $$(".col", chart).forEach((btn) => {
    btn.onpointerenter = (e) => { if (e.pointerType === "mouse" && !pinned) show(btn); };
    btn.onpointerleave = (e) => { if (e.pointerType === "mouse" && !pinned) hide(); };
    btn.onclick = () => { if (pinned === btn) { pinned = null; hide(); } else { pinned = btn; show(btn); } };
  });
}

function renderHistory() {
  const acts = state.activities;
  const week = acts.map((a) => ({ ...a, v: total(a.id, "week") })).filter((a) => a.v > 0).sort((a, b) => b.v - a.v);
  const max = Math.max(1, ...week.map((a) => a.v));
  let html = renderDaily();
  html += `<h2 class="section"><span>This week</span><span class="num">${fmtShort(week.reduce((s, a) => s + a.v, 0))}</span></h2>`;
  html += week.length
    ? `<div class="card wk">${week.map((a) => `<div style="--c:${a.color}">
        <div class="l"><span>${esc(a.name)}</span><span class="num">${fmtShort(a.v)}</span></div>
        <div class="track"><div class="fill" style="width:${(a.v / max) * 100}%"></div></div></div>`).join("")}</div>`
    : `<div class="empty">Nothing tracked this week yet.</div>`;

  if (entries.length) {
    const days = new Map();
    for (const e of entries) {
      const key = new Date(e.started_at).toDateString();
      if (!days.has(key)) days.set(key, []);
      days.get(key).push(e);
    }
    const todayKey = new Date().toDateString(), yKey = addDays(new Date(), -1).toDateString();
    for (const [key, list] of days) {
      const d = new Date(key);
      const label = key === todayKey ? "Today" : key === yKey ? "Yesterday" : d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" });
      html += `<div class="day"><b>${label}</b><span class="num">${fmtShort(list.reduce((s, e) => s + dur(e), 0))}</span></div><div class="card">`;
      html += list.map((e) => `<button class="rowi entry" data-entry="${e.id}" style="--c:${e.color}" aria-label="Edit ${esc(e.name)} entry">
          <span class="bar"></span>
          <span><div>${esc(e.name)}</div><div class="t num">${clock(e.started_at)} – ${e.stopped_at ? clock(e.stopped_at) : "now"}</div></span>
          <span class="right"><span class="d num">${fmtShort(dur(e))}</span><span class="chev">${icon("edit", 16)}</span></span></button>`).join("");
      html += `</div>`;
    }
    html += `<p class="hint">Tap an entry to change its times or activity.</p>`;
  } else {
    html += `<h2 class="section"><span>Last ${DAYS} days</span></h2><div class="empty">No entries yet.</div>`;
  }
  app.innerHTML = html;
  bindDaily();
  $$("[data-entry]").forEach((b) => b.onclick = () => openEntry(entries.find((e) => e.id == b.dataset.entry)));
}

/* ---------- edit entry ---------- */
const toLocalInput = (d) => { const x = new Date(d); return new Date(x - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); };
const editSheet = $("#editsheet");
function openEntry(e) {
  if (!e) return;
  const running = !e.stopped_at;
  const acts = state.activities.some((a) => a.id === e.activity_id) ? state.activities : [{ id: e.activity_id, name: e.name }, ...state.activities];
  const maxNow = toLocalInput(new Date());
  $("#editsheet .sheet").innerHTML = `
    <div class="grab"></div>
    <h3>Edit entry</h3>
    <form id="entryform" class="eform">
      <label>Activity
        <select class="field" name="activity">${acts.map((a) => `<option value="${a.id}" ${a.id === e.activity_id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select></label>
      <label>Start
        <input class="field num" type="datetime-local" name="start" value="${toLocalInput(e.started_at)}" max="${maxNow}" required></label>
      ${running
        ? `<p class="hint" style="margin:0">Still running. Stop it to set an end time.</p>`
        : `<label>End
        <input class="field num" type="datetime-local" name="end" value="${toLocalInput(e.stopped_at)}" max="${maxNow}" required></label>`}
      <p class="edur num" id="edur"></p>
      <div class="eactions">
        <button type="button" class="btn ghost danger" id="edel">${icon("trash", 18)}Delete</button>
        <span></span>
        <button type="button" class="btn ghost" id="ecancel">Cancel</button>
        <button type="submit" class="btn" id="esave">Save</button>
      </div>
    </form>`;
  const f = $("#entryform");
  const initial = { start: f.start.value, end: f.end?.value };
  // datetime-local drops seconds; keep the exact stored time for a field the user didn't touch
  const values = () => ({
    start: f.start.value === initial.start ? new Date(e.started_at) : new Date(f.start.value),
    end: running ? null : f.end.value === initial.end ? new Date(e.stopped_at) : new Date(f.end.value),
  });
  const upd = () => {
    const { start, end } = values();
    const secs = ((end ? end.getTime() : now()) - start) / 1000;
    $("#edur").textContent = isNaN(secs) ? "" : secs > 0 ? `Duration ${fmtShort(secs)}` : "End must be after start";
    $("#edur").classList.toggle("bad", !(secs > 0));
  };
  f.oninput = upd; upd();
  $("#ecancel").onclick = () => editSheet.close();
  $("#edel").onclick = async () => {
    if (!confirm("Delete this entry?")) return;
    try { await api(`/entries/${e.id}`, { method: "DELETE" }); editSheet.close(); await load(); toast("Entry deleted"); }
    catch (err) { toast(err.message); }
  };
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const { start, end } = values();
    if (isNaN(start) || (end && isNaN(end))) return toast("Enter a valid date and time");
    const body = { activity_id: Number(f.activity.value), started_at: start.toISOString() };
    if (!running) body.stopped_at = end.toISOString();
    $("#esave").disabled = true;
    try {
      await api(`/entries/${e.id}`, { method: "PUT", body });
      editSheet.close();
      await load();
      if (running) notify();
      toast("Entry updated");
    } catch (err) {
      toast(err.message);
      $("#esave").disabled = false;
    }
  };
  editSheet.showModal();
}
editSheet.addEventListener("click", (ev) => { if (ev.target === editSheet) editSheet.close(); });

/* ---------- activities ---------- */
function pickColor() {
  if (newColor) return newColor;
  const used = new Set(state.activities.map((a) => a.color.toLowerCase()));
  return PALETTE.find((c) => !used.has(c)) || PALETTE[state.activities.length % PALETTE.length];
}
function renderManage() {
  const acts = state.activities;
  app.innerHTML = `
    <h2 class="section"><span>New activity</span></h2>
    <form class="card addbox" id="addform" autocomplete="off">
      <div class="addrow">
        <input class="field" id="newname" maxlength="60" placeholder="e.g. Deep work" enterkeyhint="done">
        <button class="btn" id="addbtn" type="submit">${icon("plus", 18)}Add</button>
      </div>
      <div class="swatches" role="radiogroup" aria-label="Color">
        ${PALETTE.map((c) => `<button type="button" class="sw" style="--c:${c}" data-c="${c}" aria-label="Color ${c}" aria-pressed="${c === pickColor()}"></button>`).join("")}
      </div>
    </form>
    <h2 class="section"><span>Your activities</span><span>${acts.length}</span></h2>
    ${acts.length ? `<div class="card">${acts.map((a, i) => `
      <div class="editrow" data-id="${a.id}" style="--c:${a.color}">
        <label class="colorbtn" aria-label="Change color"><input type="color" value="${a.color}"></label>
        <input class="field" value="${esc(a.name)}" maxlength="60" aria-label="Name" enterkeyhint="done">
        <span class="right" style="display:flex">
          <button class="icon-btn" data-move="-1" ${i === 0 ? "disabled" : ""} aria-label="Move up">${icon("up")}</button>
          <button class="icon-btn" data-move="1" ${i === acts.length - 1 ? "disabled" : ""} aria-label="Move down">${icon("down")}</button>
          <button class="icon-btn danger" data-remove aria-label="Delete">${icon("trash")}</button>
        </span>
      </div>`).join("")}</div>
      <p class="hint">Tap a name to rename it, or the dot to change its color. Deleting an activity keeps its history.</p>`
    : `<div class="empty">Your activities will show up here.</div>`}`;

  $$(".sw").forEach((b) => b.onclick = () => {
    newColor = b.dataset.c;
    $$(".sw").forEach((x) => x.setAttribute("aria-pressed", x === b));
  });
  $("#addform").onsubmit = async (ev) => {
    ev.preventDefault();
    const name = $("#newname").value.trim();
    if (!name) return $("#newname").focus();
    $("#addbtn").disabled = true;
    try {
      await api("/activities", { method: "POST", body: { name, color: pickColor() } });
      newColor = null;
      await load();
      $("#newname")?.focus();
      toast(`Added ${name}`);
    } catch (e) { toast(e.message); $("#addbtn").disabled = false; }
  };

  $$(".editrow").forEach((row) => {
    const id = row.dataset.id;
    const act = acts.find((a) => a.id == id);
    const nameEl = $(".field", row);
    const save = async (body) => {
      try { await api(`/activities/${id}`, { method: "PUT", body }); Object.assign(act, body); }
      catch (e) { toast(e.message); }
    };
    nameEl.onkeydown = (e) => { if (e.key === "Enter") nameEl.blur(); };
    nameEl.onchange = () => {
      const v = nameEl.value.trim();
      if (!v) { nameEl.value = act.name; return; }
      save({ name: v });
    };
    const colorEl = $("input[type=color]", row);
    colorEl.oninput = () => row.style.setProperty("--c", colorEl.value);
    colorEl.onchange = () => save({ color: colorEl.value });
    $("[data-remove]", row).onclick = async () => {
      if (!confirm(`Delete "${act.name}"? Its tracked time stays in History.`)) return;
      try { await api(`/activities/${id}`, { method: "DELETE" }); await load(); } catch (e) { toast(e.message); }
    };
    $$("[data-move]", row).forEach((b) => b.onclick = async () => {
      const order = acts.map((a) => a.id);
      const i = order.indexOf(act.id), j = i + Number(b.dataset.move);
      [order[i], order[j]] = [order[j], order[i]];
      try {
        await Promise.all(order.map((aid, k) => api(`/activities/${aid}`, { method: "PUT", body: { sort: k } })));
        await load();
      } catch (e) { toast(e.message); }
    });
  });
}

/* ---------- navigation & account ---------- */
function go(v, focusAdd) {
  view = v;
  if (v === "history") {
    // entries are fetched per visit; don't flash a stale or empty list first
    $$(".tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false"));
    app.innerHTML = `<div class="empty" style="margin-top:24px">Loading…</div>`;
    return load();
  }
  render();
  if (focusAdd) $("#newname")?.focus();
  load({ background: true });
}
$$(".tabs button").forEach((b) => b.onclick = () => go(b.dataset.view));

const sheet = $("#sheet");
$("#me").onclick = () => {
  const u = state.user || {};
  renderAvatar($("#sheet-av"));
  $("#sheet-name").textContent = u.name || "Signed in";
  $("#sheet-email").textContent = u.email || "";
  sheet.showModal();
};
sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });

function signedOut() {
  sheet.close();
  signedIn = false; state = { activities: [], running: null, totals: [], user: null }; view = "track";
  render();
}
$("#logout").onclick = async () => {
  await stopNotify();
  await fetch("/auth/logout", { method: "POST" });
  window.google?.accounts?.id?.disableAutoSelect();
  signedOut();
};
$("#delacct").onclick = async () => {
  if (!confirm("Delete your account and all tracked time? This cannot be undone.")) return;
  try { await api("/me", { method: "DELETE" }); } catch (e) { return toast(e.message); }
  await stopNotify();
  signedOut();
  toast("Account deleted");
};
$("#csv").onclick = async () => {
  const r = await fetch("/api/export.csv");
  if (!r.ok) return toast("Export failed");
  const url = URL.createObjectURL(await r.blob());
  Object.assign(document.createElement("a"), { href: url, download: "timetrack.csv" }).click();
  sheet.close();
};

// live tick
setInterval(() => {
  if (!state.running || !signedIn) return;
  const v = fmt(runSec());
  const c = $("#clock"); if (c) c.textContent = v;
  const sub = $(`[data-sub="${state.running.activity_id}"]`); if (sub) sub.textContent = v;
}, 1000);
setInterval(() => signedIn && load({ background: true }), 30000);
document.addEventListener("visibilitychange", () => !document.hidden && signedIn && load({ background: true }));

// notifications (persistent timer in shade / lock screen on Android)
let swReg = null;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").then((r) => swReg = r);
$("#notif").onclick = async () => {
  sheet.close();
  if (!("Notification" in window)) return toast("Notifications not supported here");
  const p = await Notification.requestPermission();
  toast(p === "granted" ? "Lock-screen timer on" : "Notifications not allowed");
  notify();
};
async function stopNotify() {
  if (!swReg) return;
  (await swReg.getNotifications({ tag: "running" })).forEach((n) => n.close());
}
async function notify() {
  if (!swReg || !("Notification" in window) || Notification.permission !== "granted") return;
  await stopNotify();
  if (!state.running) return;
  swReg.showNotification(state.running.name, {
    tag: "running", body: "Running since " + clock(state.running.started_at),
    silent: true, requireInteraction: true, icon: "/icon-192.png",
    actions: [{ action: "stop", title: "Stop" }],
  });
}
navigator.serviceWorker?.addEventListener("message", (e) => e.data === "reload" && load());

load();
</script>
</body>
</html>
