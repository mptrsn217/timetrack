<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonglare</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f3f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1620" media="(prefers-color-scheme: dark)">
<script src="/theme.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/logo.svg" as="image">
<link rel="stylesheet" href="/app.css">
</head>
<body class="out">
<!-- Startup intro: the logo draws itself on the page background. The moon rises from behind the horizon,
     the horizon spreads, the reflection appears, then a gentle fade. Pure CSS; js/00-intro.js removes it. -->
<div id="intro" role="img" aria-label="Moonglare">
  <div class="i-logo">
    <div class="i-glow"></div>
    <div class="i-sky"><div class="i-moon"></div></div>
    <div class="i-hz"></div>
    <div class="i-water"></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2zM12 10v4M12 17.5h.01"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-1.5 4L16 12H5"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10.5 18.5h3"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></symbol>
  <symbol id="i-skip" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5.8v12.4a.8.8 0 0 0 1.2.7l9-6.2a.8.8 0 0 0 0-1.4l-9-6.2A.8.8 0 0 0 6 5.8z"/><rect x="16.5" y="5" width="2.6" height="14" rx="1"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V9"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-checksq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12.5l2.8 2.8L16.5 9"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<header class="top">
  <div class="top-in">
    <div class="brand"><img class="mark" src="/logo.svg" alt="" width="26" height="28">Moonglare</div>
    <button class="avatar" id="me" aria-label="Account"></button>
  </div>
</header>
<main id="app"></main>
<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button data-view="track"><svg width="24" height="24"><use href="#i-clock"/></svg>Track</button>
    <button data-view="habits"><svg width="24" height="24"><use href="#i-checksq"/></svg>Habits</button>
    <button data-view="overview"><svg width="24" height="24"><use href="#i-chart"/></svg>Overview</button>
    <button data-view="history"><svg width="24" height="24"><use href="#i-list"/></svg>History</button>
  </div>
</nav>

<dialog id="sheet">
  <div class="sheet">
    <div class="grab"></div>
    <div class="who"><span class="avatar" id="sheet-av"></span><div><div id="sheet-name"></div><div id="sheet-email"></div></div></div>
    <div class="menu">
      <button id="notif"><svg width="22" height="22"><use href="#i-bell"/></svg>Notifications</button>
      <div class="appearance"><span>Appearance</span>
        <div class="seg" role="radiogroup" aria-label="Appearance">
          <button type="button" data-theme-opt="auto">Auto</button><button type="button" data-theme-opt="light">Light</button><button type="button" data-theme-opt="dark">Dark</button>
        </div></div>
      <div class="appearance"><span>When I start a timer, open</span>
        <div class="seg" role="radiogroup" aria-label="Screen to open when a timer starts">
          <button type="button" data-auto="off">Nothing</button><button type="button" data-auto="mini">Minimal</button><button type="button" data-auto="live">Details</button>
        </div></div>
      <button id="installbtn" hidden><svg width="22" height="22"><use href="#i-home"/></svg>Add to Home Screen</button>
      <button id="csv"><svg width="22" height="22"><use href="#i-dl"/></svg>Export CSV (spreadsheet)</button>
      <button id="backup"><svg width="22" height="22"><use href="#i-dl"/></svg>Download backup</button>
      <button id="restore"><svg width="22" height="22"><use href="#i-upload"/></svg>Restore from backup</button>
      <input type="file" id="restorefile" accept="application/json,.json" hidden>
      <a href="/privacy.html"><svg width="22" height="22"><use href="#i-shield"/></svg>Privacy</a>
      <hr>
      <hr>
      <button id="logout"><svg width="22" height="22"><use href="#i-out"/></svg>Sign out</button>
      <button id="signoutall"><svg width="22" height="22"><use href="#i-out"/></svg>Sign out everywhere</button>
      <button id="delacct" class="danger"><svg width="22" height="22"><use href="#i-trash"/></svg>Delete account</button>
    </div>
  </div>
</dialog>
<dialog id="live" class="livedlg" aria-label="Live screen"></dialog>
<dialog id="mini" class="minidlg" aria-label="Minimal timer"></dialog>
<dialog id="editsheet"><div class="sheet"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://accounts.google.com/gsi/client" async></script>

<script src="/js/00-intro.js"></script>
<script src="/js/01-core.js"></script>
<script src="/js/02-login.js"></script>
<script src="/js/03-track-status.js"></script>
<script src="/js/04-habits.js"></script>
<script src="/js/05-live.js"></script>
<script src="/js/07-starter.js"></script>
<script src="/js/08-track.js"></script>
<script src="/js/09-history.js"></script>
<script src="/js/10-entries.js"></script>
<script src="/js/11-goals.js"></script>
<script src="/js/12-activities.js"></script>
<script src="/js/13-account.js"></script>
<script src="/js/14-appearance.js"></script>
<script src="/js/15-push.js"></script>
</body>
</html>
