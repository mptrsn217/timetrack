  });
}

// Horizontal drag on a row; past ~35% of its width it deletes, otherwise it springs back.
// Vertical movement is left to the browser (touch-action: pan-y) so the list still scrolls.
function enableSwipe(row, onDelete) {
  const bg = row.previousElementSibling;
  let x0 = 0, y0 = 0, dx = 0, id = null, dragging = false;
  const set = (x, cls) => {
    row.className = row.className.replace(/ ?(moving|settle)/g, "") + (cls ? " " + cls : "");
    row.style.transform = x ? `translateX(${x}px)` : "";
    row.parentElement.classList.toggle("swiping", !!x);
  };
  row.addEventListener("pointerdown", (ev) => {
    if (ev.pointerType === "mouse" && ev.button !== 0) return;
    id = ev.pointerId; x0 = ev.clientX; y0 = ev.clientY; dx = 0; dragging = false;
    delete row.dataset.swiped;
  });
  row.addEventListener("pointermove", (ev) => {
    if (ev.pointerId !== id) return;
    const mx = ev.clientX - x0, my = ev.clientY - y0;
    if (!dragging) {
      if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)) { id = null; return; } // it's a scroll
      if (Math.abs(mx) < 10) return;
      dragging = true;
      try { row.setPointerCapture(id); } catch {}
    }
    dx = mx;
    set(dx, "moving");
    bg?.classList.toggle("ready", Math.abs(dx) > row.offsetWidth * 0.35);
  });
  const end = (ev) => {
    if (ev.pointerId !== id) return;
    id = null;
    if (!dragging) return;
    row.dataset.swiped = "1"; // swallow the click that follows the drag
    setTimeout(() => delete row.dataset.swiped, 50);
    if (Math.abs(dx) > row.offsetWidth * 0.35) {
      set(Math.sign(dx) * row.offsetWidth * 1.1, "settle");
      setTimeout(onDelete, 180);
    } else {
      set(0, "settle");
      bg?.classList.remove("ready");
    }
  };
  row.addEventListener("pointerup", end);
  row.addEventListener("pointercancel", end);
}

async function deleteWithUndo(e) {
  try { await api(`/entries/${e.id}`, { method: "DELETE" }); }
  catch (err) { toast(err.message); return renderEntryList(); }
  entries = entries.filter((x) => x.id !== e.id);
  if (searchResults) searchResults = searchResults.filter((x) => x.id !== e.id);
  renderHistory();
  toast(`Deleted ${e.name} ${fmtShort(dur(e))}`, {
    label: "Undo",
    run: async () => {
      try {
        await api("/entries", { method: "POST", body: { activity_id: e.activity_id, started_at: e.started_at, stopped_at: e.stopped_at, note: e.note } });
        await refreshAfterEdit();
        toast("Entry restored");
      } catch (err) { toast(err.message); }
    },
  });
  load({ background: true });
}

/* ---------- add / edit entry ---------- */
const toLocalInput = (d) => { const x = new Date(d); return new Date(x - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); };
// separate date and time boxes, so changing only the time is one tap
function dateTimeField(name, label, value) {
  const [d, t] = toLocalInput(value).split("T");
  return `<fieldset class="dt"><legend>${label}</legend>
    <input class="field num" type="date" name="${name}_d" value="${d}" max="${toLocalInput(new Date()).slice(0, 10)}" aria-label="${label} date" required>
    <input class="field num" type="time" name="${name}_t" value="${t}" aria-label="${label} time" required></fieldset>`;
}
const readDT = (f, name) => `${f[name + "_d"].value}T${f[name + "_t"].value}`;
const editSheet = $("#editsheet");
const roundTo5 = (ms) => Math.floor(ms / 3e5) * 3e5;
function openEntry(e) {
  const isNew = !e;
  if (isNew) {
    if (!state.activities.length) return toast("Add an activity first");
    const end = roundTo5(now());
    e = { activity_id: (entries[0] && state.activities.some((a) => a.id === entries[0].activity_id) ? entries[0].activity_id : state.activities[0].id),
      started_at: new Date(end - 3600e3).toISOString(), stopped_at: new Date(end).toISOString(), note: "" };
  }
  const running = !e.stopped_at;
  const acts = state.activities.some((a) => a.id === e.activity_id) ? state.activities : [{ id: e.activity_id, name: e.name }, ...state.activities];
  $("#editsheet .sheet").innerHTML = `
    <div class="grab"></div>
    <h3 tabindex="-1" autofocus>${isNew ? "Add entry" : "Edit entry"}</h3>
    <form id="entryform" class="eform">
      <label>Activity
        <select class="field" name="activity">${acts.map((a) => `<option value="${a.id}" ${a.id === e.activity_id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select></label>
      ${dateTimeField("start", "Start", e.started_at)}
      ${running
        ? `<p class="hint" style="margin:0">Still running. Stop it to set an end time.</p>`
        : dateTimeField("end", "End", e.stopped_at)}
      <label>Note
        <textarea class="field" name="note" rows="2" maxlength="500" placeholder="Optional, e.g. what you worked on">${esc(e.note || "")}</textarea></label>
      <p class="edur num" id="edur"></p>
      <div class="eactions">
        ${isNew ? "<span></span>" : `<button type="button" class="btn ghost danger" id="edel">${icon("trash", 18)}Delete</button>`}
        <span></span>
        <button type="button" class="btn ghost" id="ecancel">Cancel</button>
        <button type="submit" class="btn" id="esave">${isNew ? "Add" : "Save"}</button>
      </div>
    </form>`;
  const f = $("#entryform");
  const initial = isNew ? {} : { start: readDT(f, "start"), end: running ? null : readDT(f, "end") };
  // the inputs drop seconds; keep the exact stored time for a field the user didn't touch
  const values = () => ({
    start: readDT(f, "start") === initial.start ? new Date(e.started_at) : new Date(readDT(f, "start")),
    end: running ? null : readDT(f, "end") === initial.end ? new Date(e.stopped_at) : new Date(readDT(f, "end")),
  });
  // moving the start to another day takes a same-day end along with it
  let prevStartDay = f.start_d.value;
  f.start_d.addEventListener("change", () => {
    if (f.end_d && f.end_d.value === prevStartDay) f.end_d.value = f.start_d.value;
    prevStartDay = f.start_d.value;
  });
  const upd = () => {
    const { start, end } = values();
    const secs = ((end ? end.getTime() : now()) - start) / 1000;
    $("#edur").textContent = isNaN(secs) ? "" : secs > 0 ? `Duration ${fmtShort(secs)}` : "End must be after start";
    $("#edur").classList.toggle("bad", !(secs > 0));
  };
  f.oninput = upd; upd();
  $("#ecancel").onclick = () => editSheet.close();
  $("#edel")?.addEventListener("click", async () => {
    if (!confirm("Delete this entry?")) return;
    try { await api(`/entries/${e.id}`, { method: "DELETE" }); editSheet.close(); await refreshAfterEdit(); toast("Entry deleted"); }
    catch (err) { toast(err.message); }
  });
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const { start, end } = values();
    if (isNaN(start) || (end && isNaN(end))) return toast("Enter a valid date and time");
    const body = { activity_id: Number(f.activity.value), started_at: start.toISOString(), note: f.note.value };
    if (!running) body.stopped_at = end.toISOString();
    $("#esave").disabled = true;
    try {
      await api(isNew ? "/entries" : `/entries/${e.id}`, { method: isNew ? "POST" : "PUT", body });
      editSheet.close();
      await refreshAfterEdit();
      if (running) notify();
      toast(isNew ? "Entry added" : "Entry updated");
    } catch (err) {
      toast(err.message);
      $("#esave").disabled = false;
    }
  };
  editSheet.showModal();
}
async function refreshAfterEdit() {
  if (searchResults && searchQ) { try { searchResults = await api(`/entries?q=${encodeURIComponent(searchQ)}`); } catch {} }
  await load();
}
editSheet.addEventListener("click", (ev) => { if (ev.target === editSheet) editSheet.close(); });

/* ---------- forgotten timer ---------- */
// A timer running far longer than usual was probably left on by accident; offer to set the real end time.
let keepRunning = [];
try { keepRunning = JSON.parse(localStorage.getItem("keepRunning") || "[]"); } catch {}
function maybeForgotten() {
  const r = state.running;
  if (!r || editSheet.open || sheet.open || keepRunning.includes(r.id)) return;
  const usual = state.stats?.sessions ? state.stats.avg : 0;
  if (runSec() < Math.max(4 * 3600, 3 * usual)) return;
  const start = new Date(r.started_at).getTime();
  const suggest = Math.min(start + (usual || 3600) * 1000, now() - 60e3);
  const since = new Date(r.started_at).toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" });
  $("#editsheet .sheet").innerHTML = `
    <div class="grab"></div>
    <h3 tabindex="-1" autofocus>Still doing ${esc(r.name)}?</h3>
    <form id="forgotform" class="eform">
      <p class="hint" style="margin:0 4px">It has been running for <b class="num">${fmtShort(runSec())}</b>, since ${since}${usual ? `. It usually lasts about ${fmtShort(usual)}` : ""}.</p>
      ${dateTimeField("end", "When did you actually stop?", suggest)}
      <div class="eactions">
        <button type="button" class="btn ghost" id="fkeep">Keep running</button>
        <span></span>
        <button type="button" class="btn ghost" id="fnow">Stop now</button>
        <button type="submit" class="btn">Save</button>
      </div>
    </form>`;
  const f = $("#forgotform");
  $("#fkeep").onclick = () => {
    keepRunning = [...keepRunning.slice(-19), r.id];
    try { localStorage.setItem("keepRunning", JSON.stringify(keepRunning)); } catch {}
    editSheet.close();
  };
  $("#fnow").onclick = async () => { editSheet.close(); await stop(); };
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const end = new Date(readDT(f, "end"));
    if (isNaN(end) || end <= start) return toast("Pick a time after it started");
    try {
      await api(`/entries/${r.id}`, { method: "PUT", body: { stopped_at: end.toISOString() } });
      editSheet.close();
      await load();
      notify();
      toast(`Stopped at ${clock(end)}`);
    } catch (err) { toast(err.message); }
  };
  editSheet.showModal();
}

/* ---------- goals ---------- */
const periodWord = (p) => (p === "day" ? "today" : "this week");

// Live progress of the running activity toward its daily/weekly goal (or limit), recomputed every second
function liveGoalHTML(a) {
  if (!a) return "";
  if (!a.goal_minutes) {
    return `<div class="gl1"><span class="muted">No ${a.kind === "limit" ? "limit" : "goal"} for ${esc(a.name)} yet</span>
      <button type="button" class="linkbtn" id="setlivegoal">${icon("flag", 14)}Set ${a.kind === "limit" ? "limit" : "goal"}</button></div>`;
  }
  const g = goalState(a);
  const left = g.g - g.v;
  const at = (sec) => clock(now() + sec * 1000);
  const when = periodWord(a.goal_period);
  const label = `${a.kind === "limit" ? "Limit" : "Goal"} ${fmtShort(g.g)} ${when}`;
  let head, sub, cls = "";
  if (a.kind === "limit") {
    if (g.over) { head = `${icon("alert", 16)}Over limit by ${fmtShort(-left)}`; sub = `${label} · stop now to limit the damage`; cls = "warn"; }
    else { head = `${fmtShort(left)} left before your limit`; sub = `${label} · reached at ${at(left)} if you keep going`; }
  } else if (g.done) {
    head = `Goal reached · ${fmtShort(-left) === "0m" ? "just now" : `+${fmtShort(-left)}`}`; sub = `${label} · ${fmtShort(g.v)} done`; cls = "rec";
  } else {
    head = `${fmtShort(left + 59)} to your goal`; sub = `${label} · ${fmtShort(g.v)} done · reached at ${at(left)}`;
  }
  return `<div class="gl1 ${cls}"><span>${icon("flag", 15)}${head}</span></div>
    <div class="gbar${g.over ? " over" : ""}" role="progressbar" aria-label="${esc(label)}" aria-valuenow="${Math.round(g.pct * 100)}" aria-valuemin="0" aria-valuemax="100">
      <div class="gfill" style="width:${g.pct * 100}%"></div></div>
    <div class="gsub num">${sub}</div>`;
}
function bindLiveGoal(a) {
  const b = $("#setlivegoal");
  if (b && a) b.onclick = () => openGoal(a);
}
function goalState(a) {
  if (!a.goal_minutes) return null;
  const v = total(a.id, a.goal_period === "day" ? "today" : "week"), g = a.goal_minutes * 60;
  return { v, g, pct: Math.min(v / g, 1), done: a.kind !== "limit" && v >= g, over: a.kind === "limit" && v > g };
}
function goalLabel(a) {
  if (!a.goal_minutes) return a.kind === "limit" ? "Set limit" : "Set goal";
  return `${a.kind === "limit" ? "Limit" : "Goal"} ${fmtShort(a.goal_minutes * 60)} / ${a.goal_period}`;
}
function openGoal(act, onSaved) {
  const limit = act.kind === "limit";
  let period = act.goal_period || "off";
  const mins = act.goal_minutes || (limit ? 30 : 60);

async function download(url, fallbackName) {
  const r = await fetch(url);
  if (!r.ok) return toast("Download failed");
  const name = /filename="([^"]+)"/.exec(r.headers.get("content-disposition") || "")?.[1] || fallbackName;
  const href = URL.createObjectURL(await r.blob());
  Object.assign(document.createElement("a"), { href, download: name }).click();
  setTimeout(() => URL.revokeObjectURL(href), 10e3);
}

};
// don't wait on serviceWorker.ready here: it never settles if the worker failed to install
async function currentSub() {
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
async function activeRegistration() {
  if (!(await navigator.serviceWorker.getRegistration())) await navigator.serviceWorker.register("/sw.js");
  return Promise.race([
    navigator.serviceWorker.ready,
    new Promise((_, no) => setTimeout(() => no(new Error("The app's background service couldn't start. Reload and try again.")), 10e3)),
  ]);
}
// a browser keeps its subscription across sign-outs; make sure the server files it under whoever is signed in now
async function syncSub() {
  try {
    const sub = await currentSub();
    if (sub && Notification.permission === "granted") await api("/push/subscribe", { method: "POST", body: { subscription: sub.toJSON() } });
  } catch {}
}
const PUSH_PREFS = [
  ["running", "Timer started and stopped", "Shows what you're tracking on the lock screen"],
  ["forgot", "Forgotten timer", "When a timer runs much longer than usual"],
  ["goals", "Goals and limits", "When you reach a goal, or get close to or pass a limit"],
  ["review", "Weekly review", "Sunday evening: your week in numbers"],
];
async function openNotifications() {
  sheet.close();
  let info = null, sub = null;
  if (pushSupported()) {
    try { [info, sub] = await Promise.all([api("/push"), currentSub()]); } catch (e) { return toast(e.message); }
  }
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  let body;
  if (!pushSupported()) {
    body = isIOS && !isStandalone
      ? `<p class="hint" style="margin:0 4px">On iPhone, notifications only work in the Home Screen app (iOS 16.4 or newer):</p>
         <ol class="steps"><li>In Safari, tap <b>Share</b> → <b>Add to Home Screen</b>.</li><li>Open <b>Timetrack</b> from your Home Screen and sign in.</li><li>Come back here and tap <b>Turn on</b>.</li></ol>`
      : `<p class="hint" style="margin:0 4px">This browser can't show notifications. Try Chrome on Android, or the Home Screen app on iPhone.</p>`;
  } else {
    const on = !!sub;
    body = `
      <div class="nstatus ${on ? "on" : ""}">${on ? "On for this device" : perm === "denied" ? "Blocked for this site" : "Off for this device"}</div>
      ${perm === "denied" ? `<p class="hint" style="margin:0 4px">Notifications are blocked. Allow them in your phone's settings (iPhone: Settings → Notifications → Timetrack), then come back.</p>` : ""}
      <div class="nprefs">${PUSH_PREFS.map(([k, t, d]) => `
        <button type="button" class="nrow" data-pref="${k}" aria-pressed="${info.prefs[k]}"><span class="box" aria-hidden="true"></span>
          <span><b>${t}</b><small>${d}</small></span></button>`).join("")}</div>
      <p class="hint" style="margin:0 4px">These settings apply to all your devices${info.devices > 1 ? ` (${info.devices} have notifications on)` : ""}.</p>
      <div class="eactions">
        ${on ? `<button type="button" class="btn ghost" id="ntest">Send test</button>` : "<span></span>"}
        <span></span><span></span>
        <button type="button" class="btn${on ? " ghost" : ""}" id="ntoggle" ${perm === "denied" ? "disabled" : ""}>${on ? "Turn off" : "Turn on"}</button>
      </div>`;
  }
  $("#editsheet .sheet").innerHTML = `<div class="grab"></div><h3 tabindex="-1" autofocus>Notifications</h3><div class="eform">${body}</div>`;
  $$("[data-pref]").forEach((b) => b.onclick = async () => {
    const val = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", val);
    try { await api("/push/prefs", { method: "PUT", body: { [b.dataset.pref]: val } }); }
    catch (e) { b.setAttribute("aria-pressed", !val); toast(e.message); }
  });
  $("#ntest")?.addEventListener("click", async () => {
    try {
      const r = await api("/push/test", { method: "POST" });
      toast(r.sent ? "Test sent. It should appear in a few seconds" : "No device received it. Try turning notifications off and on");
    } catch (e) { toast(e.message); }
  });
  $("#ntoggle")?.addEventListener("click", async (ev) => {
    ev.currentTarget.disabled = true;
    try {
      if (sub) {
        await api("/push/unsubscribe", { method: "POST", body: { endpoint: sub.endpoint } });
        await sub.unsubscribe();
        toast("Notifications off for this device");
      } else {
        // must be the first await inside the tap, or iPhone refuses to ask
        const p = await Notification.requestPermission();
        if (p !== "granted") { toast("Notifications weren't allowed"); return openNotifications(); }
        const reg = await activeRegistration();
        const s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(info.publicKey) });
        await api("/push/subscribe", { method: "POST", body: { subscription: s.toJSON() } });
        await stopNotify();
        toast("Notifications on");
      }
    } catch (e) { toast(e.message || "Couldn't change notifications"); }
    openNotifications();
  });
  editSheet.showModal();
}
$("#notif").onclick = openNotifications;
async function stopNotify() {
  if (!swReg) return;
  (await swReg.getNotifications({ tag: "running" })).forEach((n) => n.close());
}
async function notify() {
  if (!swReg || !("Notification" in window) || Notification.permission !== "granted") return;
  if (await currentSub()) return; // the server sends it as a push instead
  await stopNotify();
  if (!state.running) return;
  swReg.showNotification(state.running.name, {
    tag: "running", body: "Running since " + clock(state.running.started_at),
    silent: true, requireInteraction: true, icon: "/icon-192.png",
    actions: [{ action: "stop", title: "Stop" }],
  });
}
navigator.serviceWorker?.addEventListener("message", (e) => {
  if (e.data === "reload") load();
  else if (e.data?.type === "open") openFromUrl(e.data.url);
});
// a notification can point at a screen, e.g. /?review=2026-09-28
function openFromUrl(url) {
  const review = new URL(url, location.origin).searchParams.get("review");
  if (review && signedIn) openReview(/^\d{4}-\d{2}-\d{2}$/.test(review) ? review : undefined);
}

load().then(() => {
  if (!signedIn) return;
  syncSub();
  if (location.search) { openFromUrl(location.href); history.replaceState(null, "", "/"); }
  else maybeInstallGuide();
});
</script>
</body>
