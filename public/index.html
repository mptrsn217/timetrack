<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timetrack</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131519" media="(prefers-color-scheme: dark)">
<script>
  // apply a chosen theme before anything is drawn, so the page never flashes the other one
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efeee9; --line: #e4e2dc;
    --ink: #1a1c21; --muted: #6c707a; --faint: #a3a6ad;
    --accent: #d8920f; --accent-ink: #1a1405; --danger: #d0453f; --good: #1f9d55;
    --shadow: 0 1px 2px rgba(20, 20, 30, .05), 0 4px 16px rgba(20, 20, 30, .05);
    --radius: 18px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131519; --surface: #1c1f25; --surface-2: #252932; --line: #2c3039;
      --ink: #eef0f3; --muted: #8e94a0; --faint: #5d626d;
      --accent: #f2b33d; --accent-ink: #1a1405; --danger: #ef6a63; --good: #4cc38a;
      --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
      --bg: #131519; --surface: #1c1f25; --surface-2: #252932; --line: #2c3039;
      --ink: #eef0f3; --muted: #8e94a0; --faint: #5d626d;
      --accent: #f2b33d; --accent-ink: #1a1405; --danger: #ef6a63; --good: #4cc38a;
      --shadow: none;
      color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  svg { display: block; }

  /* shell */
  .top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; }
  .top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .brand .mark { width: 28px; height: 28px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); overflow: hidden;
    display: grid; place-items: center; font-weight: 700; color: var(--muted); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  main { max-width: 560px; margin: 0 auto; padding: 8px 16px calc(96px + env(safe-area-inset-bottom)); }
  h2.section { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
    margin: 26px 4px 10px; display: flex; justify-content: space-between; }
  h2.section span:last-child { text-transform: none; letter-spacing: 0; font-weight: 500; }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface);
    border-top: 1px solid var(--line); padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); }
  .tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  .tabs button { display: grid; justify-items: center; gap: 2px; padding: 6px 0; color: var(--faint); font-size: 12px; font-weight: 600; }
  .tabs button[aria-current="page"] { color: var(--ink); }
  .tabs button[aria-current="page"] svg { color: var(--accent); }
  body.out .tabs, body.out .avatar { display: none; }

  /* hero */
  .hero { position: relative; overflow: hidden; border-radius: 24px; padding: 20px; background: var(--surface);
    box-shadow: var(--shadow); min-height: 168px; display: flex; flex-direction: column; justify-content: space-between; }
  .hero.on { background: color-mix(in srgb, var(--c) 16%, var(--surface)); }
  .hero .label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 600; }
  .hero .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--c); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .hero .name { font-size: 22px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .hero .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 18px; }
  .hero .clock { font-size: clamp(44px, 14vw, 60px); font-weight: 750; letter-spacing: -.03em; line-height: 1; }
  .hero .since { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .btn-stop { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg);
    padding: 14px 20px; border-radius: 999px; font-weight: 700; flex-shrink: 0; }
  .btn-stop:active { transform: scale(.97); }
  .goal { margin-top: 18px; padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--c) 25%, transparent); }
  .goal .gl1 { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; }
  .goal .streak { flex-shrink: 0; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 99px;
    background: color-mix(in srgb, var(--c) 22%, transparent); }
  .goal .gbar { position: relative; height: 8px; border-radius: 99px; margin: 10px 0 8px;
    background: color-mix(in srgb, var(--c) 18%, var(--surface)); }
  .goal .gfill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--c); }
  .goal .gmark { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 2px; background: var(--ink); opacity: .55; }
  .goal .gsub { color: var(--muted); font-size: 13px; }
  .goal.live:empty { display: none; }
  .goal.live .gl1 span { display: inline-flex; align-items: center; gap: 6px; }
  .goal.live .gl1 span.muted { color: var(--muted); font-weight: 500; font-size: 14px; }
  .goal .gbar.over .gfill { background: var(--danger); }
  .goal .gl1.rec span:first-child { color: var(--c); }
  .goal .gl1.warn span:first-child { color: var(--danger); display: inline-flex; align-items: center; gap: 6px; }
  .kindtag { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface-2); padding: 2px 7px; border-radius: 99px;
    margin-left: 8px; vertical-align: middle; }
  .tile .top-l { display: flex; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 7px 12px; border-radius: 99px;
    font-size: 13px; font-weight: 600; color: var(--muted); background: var(--surface-2); }
  .chip[aria-pressed="true"] { color: var(--ink); }
  /* checkbox look: empty square when off, filled with a tick when on */
  .chip .box { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--faint); flex-shrink: 0; position: relative; }
  .chip[aria-pressed="true"] .box { background: var(--ink); border-color: var(--ink); }
  .chip[aria-pressed="true"] .box::after { content: ""; position: absolute; left: 3px; top: 0; width: 4px; height: 7px;
    border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .editrow .name-col { display: grid; gap: 2px; min-width: 0; }
  .editrow .chip { margin: 0 0 4px 10px; justify-self: start; padding: 4px 10px; font-size: 12px; }

  .hero.idle { min-height: 0; gap: 14px; justify-content: flex-start; }
  .resume { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px; border-radius: 16px;
    background: color-mix(in srgb, var(--c) 12%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }
  .resume:active { transform: scale(.98); }
  .resume .rplay { width: 40px; height: 40px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .resume b { display: block; font-size: 17px; overflow-wrap: anywhere; }
  .resume small { color: var(--muted); font-size: 13px; }
  .glist { display: grid; gap: 10px; }
  .glist .label { margin-bottom: -2px; }
  .grow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; font-size: 14px; }
  .grow .gname { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grow .gname i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  .grow .gval { color: var(--muted); font-size: 13px; }
  .grow .gval.done { color: var(--ink); }
  .grow .gval.warn { color: var(--danger); font-weight: 600; }
  .grow .gtrack { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .grow .gtrack span { display: block; height: 100%; border-radius: 99px; background: var(--c); }
  .grow .gtrack.over span { background: var(--danger); }
  .setgoals { justify-self: start; }
  .hbtns { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .btn-pause { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink); }
  .btn-pause:active { transform: scale(.95); }
  .hero.paused { background: color-mix(in srgb, var(--c) 8%, var(--surface)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent); }
  .hero.paused .pulse { background: var(--c); }
  .hero .endbreak { margin-top: 12px; justify-self: start; align-self: flex-start; color: var(--muted); }
  .pchoices { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; }
  .pchoice { padding: 14px 0; border-radius: 12px; background: var(--surface-2); font-weight: 700; }
  .pchoice:active { transform: scale(.97); }
  .streakl { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--c); }
  .keys { display: grid; gap: 2px; }
  .keyrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  .keyrow small, .newkey small { display: block; color: var(--muted); font-size: 12px; }
  .newkey { display: grid; gap: 8px; padding: 12px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .newkey .btn { justify-self: start; margin: 0; }
  .eform code, .guide code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface-2);
    padding: 2px 6px; border-radius: 6px; overflow-wrap: anywhere; }
  .newkey code { padding: 8px 10px; user-select: all; }
  .guide { font-size: 14px; }
  .guide summary { cursor: pointer; font-weight: 650; padding: 6px 4px; }
  .guide ol { padding-left: 22px; margin: 6px 0; display: grid; gap: 8px; }
  .guide ul { padding-left: 18px; margin: 4px 0; }
  .copyrow { display: flex; align-items: center; gap: 4px; margin-top: 4px; min-width: 0; }
  .copyrow code { flex: 1; min-width: 0; }
  .daybar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin-top: 16px; gap: 2px; }
  .daybar span { background: var(--c); min-width: 3px; }

  /* activity tiles */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { position: relative; text-align: left; padding: 16px; border-radius: var(--radius); background: var(--surface);
    box-shadow: var(--shadow); min-height: 104px; display: flex; flex-direction: column; justify-content: space-between;
    transition: transform .12s ease, background .2s ease; }
  .tile:active { transform: scale(.97); }
  .tile .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .tile .nm { font-weight: 650; font-size: 16px; margin-top: 14px; overflow-wrap: anywhere; line-height: 1.25; }
  .tile .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .tile.on { background: color-mix(in srgb, var(--c) 18%, var(--surface)); box-shadow: inset 0 0 0 2px var(--c); }
  .tile.on .sub { color: var(--ink); font-weight: 600; }
  .tile .play { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
  .tile.on .play { background: var(--c); color: #fff; }

  .empty { text-align: center; padding: 36px 20px; color: var(--muted); background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent);
    color: var(--accent-ink); padding: 12px 18px; border-radius: 12px; font-weight: 700; margin-top: 14px; }
  .btn:disabled { opacity: .45; cursor: default; }

  /* cards / lists */
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .card + .card { margin-top: 10px; }
  .rowi { display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center; padding: 13px 14px; }
  .rowi + .rowi { border-top: 1px solid var(--line); }
  .rowi .bar { width: 4px; height: 32px; border-radius: 4px; background: var(--c); justify-self: center; }
  .rowi .t { color: var(--muted); font-size: 13px; }
  .rowi .d { font-weight: 650; }
  .rowi .right { display: flex; align-items: center; gap: 4px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--faint); }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn:disabled { opacity: .3; pointer-events: none; }

  .wk { padding: 14px; display: grid; gap: 12px; }
  .wk .l { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .wk .l span:last-child { color: var(--muted); }
  .wk .track { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .wk .fill { height: 100%; background: var(--c); border-radius: 99px; }

  /* edit */
  .field { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: 12px;
    padding: 12px 14px; font-size: 16px; min-width: 0; }
  .field:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .addbox { padding: 14px; }
  .addrow { display: flex; gap: 8px; }
  .addrow .btn { margin-top: 0; }
  .swatches { display: grid; grid-template-columns: repeat(8, minmax(0, 32px)); justify-content: space-between; gap: 10px 6px; margin-top: 12px; }
  .sw { width: 100%; aspect-ratio: 1; height: auto; max-width: 32px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; background: var(--c); position: relative; }
  .sw[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--c); }
  .editrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 10px 10px 14px; }
  .editrow + .editrow { border-top: 1px solid var(--line); }
  .editrow .field { background: transparent; padding: 10px; }
  .editrow .field:focus { background: var(--surface-2); }
  .colorbtn { width: 32px; height: 32px; border-radius: 50%; background: var(--c); position: relative; overflow: hidden; }
  .colorbtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: 0; padding: 0; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 4px 0; }

  /* history */
  .day { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 4px 8px; }
  .day b { font-size: 15px; }
  .day span { color: var(--muted); font-size: 14px; }

  /* login */
  .login { min-height: calc(100vh - 140px); display: grid; align-content: center; justify-items: center; text-align: center; gap: 16px; padding: 24px 0; }
  .login .mark { width: 64px; height: 64px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .login h1 { margin: 6px 0 0; font-size: 32px; letter-spacing: -.02em; }
  .login p { margin: 0; color: var(--muted); max-width: 300px; }
  .login .demo { display: grid; gap: 8px; width: 100%; max-width: 300px; margin: 12px 0; }
  .login .demo div { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; font-size: 15px; }
  .login .demo i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .login .demo em { margin-left: auto; font-style: normal; color: var(--muted); font-weight: 500; }
  .login .fine { font-size: 12px; color: var(--faint); }
  .login a { color: inherit; }
  #gbtn { min-height: 44px; }

  /* sheet */
  dialog { border: 0; padding: 0; background: var(--surface); color: var(--ink); border-radius: 24px 24px 0 0;
    width: 100%; max-width: min(560px, 100vw); max-height: 92dvh; overflow-y: auto; overflow-x: hidden;
    margin: auto auto 0; box-shadow: 0 -8px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10, 12, 16, .45); }
  .sheet { padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 14px; }
  .sheet .who { display: flex; align-items: center; gap: 12px; padding: 4px 4px 14px; }
  .sheet .who .avatar { width: 44px; height: 44px; }
  .sheet .who div div:last-child { color: var(--muted); font-size: 14px; }
  .menu button, .menu a { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 8px; border-radius: 12px;
    text-align: left; color: var(--ink); text-decoration: none; font-weight: 550; }
  .menu button:hover, .menu a:hover { background: var(--surface-2); }
  .menu svg { color: var(--muted); }
  .menu .danger, .menu .danger svg { color: var(--danger); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

  /* daily chart */
  .chart { position: relative; padding: 16px 14px 12px; overflow: visible; }
  .plot { position: relative; margin: 6px 0 44px 30px; }
  .gl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .gl span { position: absolute; right: 100%; transform: translateY(-50%); padding-right: 6px; font-size: 11px; color: var(--faint); }
  .cols { position: absolute; left: 0; right: 0; bottom: -34px; top: 0; display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }
  .col { display: flex; flex-direction: column; align-items: center; min-width: 0; border-radius: 6px; }
  .col .stack { width: 100%; display: flex; align-items: flex-end; justify-content: center; border-radius: 6px; }
  .col .segs { width: min(100%, 18px); display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 4px 4px 0 0; overflow: hidden; }
  .col .segs span { background: var(--c); min-height: 2px; flex-shrink: 0; }
  .col .xl { display: grid; justify-items: center; margin-top: 6px; font-size: 10px; line-height: 1.25; color: var(--faint); }
  .col .xl b { font-weight: 600; color: var(--muted); }
  .col.today .xl, .col.today .xl b { color: var(--ink); }
  .col.sel .stack { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
  .seg button { padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .tl { display: grid; gap: 5px; margin-bottom: 14px; }
  .tl-row { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 6px; }
  .tl-d { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .tl-row.today .tl-d { color: var(--ink); font-weight: 700; }
  .tl-track { position: relative; height: 16px; border-radius: 4px; background-color: color-mix(in srgb, var(--surface-2) 60%, transparent);
    background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: 25% 100%; }
  .blk { position: absolute; top: 0; bottom: 0; min-width: 3px; border-radius: 3px; background: var(--c); box-shadow: 0 0 0 1px var(--surface); }
  .blk:hover { filter: brightness(1.1); }
  .tl-now { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 2px; background: var(--ink); }
  .tl-axis { position: relative; height: 14px; }
  .tl-axis span { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--faint); }
  .tl-axis span:first-child { transform: none; }
  .tl-axis span:last-child { transform: translateX(-100%); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .lg { display: inline-flex; align-items: center; gap: 6px; }
  .lg i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }

<div id="toast" role="status" aria-live="polite"></div>
<script src="https://accounts.google.com/gsi/client" async></script>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $("#app");
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
// validated categorical order: adjacent pairs stay distinguishable for colorblind users on light and dark
const PALETTE = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767",
  "#2f9fd0", "#b86e2e", "#009b8f", "#8a62c9", "#7c8a1a", "#b3478c", "#5b6bd8", "#b0584f"];
let signedIn = false;
let state = { activities: [], running: null, totals: [], user: null };
let view = "track";
let offset = 0; // serverNow - clientNow ms
let entries = [];
let newKind = "good";
let newColor = null; // user-picked color for the next activity; null = next unused palette slot

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, {
    ...opts,
    headers: { "content-type": "application/json", ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 401) { signedIn = false; render(); throw new Error("Please sign in"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
let toastTimer;
function toast(msg, action) {
  const e = $("#toast");
  // an open modal sheet sits in the top layer above the page; move the toast into it so it stays visible
  const host = $("dialog[open]") || document.body;
  if (e.parentElement !== host) host.appendChild(e);
  e.textContent = msg;
  e.classList.toggle("act", !!action);
  if (action) {
    const b = document.createElement("button");
    b.textContent = action.label;
    b.onclick = () => { e.classList.remove("show"); action.run(); };
    e.appendChild(b);
  }
  e.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove("show"), action ? 6000 : 2800);
}
function now() { return Date.now() + offset; }
function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
function fmtShort(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
}
const clock = (d) => new Date(d).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
function runSec() { return state.running ? (now() - new Date(state.running.started_at)) / 1000 : 0; }
// server totals are a snapshot; add the time elapsed since then for the running activity
let loadedAt = Date.now();
function total(id, key) {
  const t = state.totals.find((x) => x.activity_id === id);
  let v = t ? Number(t[key]) : 0;
  if (state.running?.activity_id === id) v += (Date.now() - loadedAt) / 1000;
  return v;
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (id, size = 20) => `<svg width="${size}" height="${size}"><use href="#i-${id}"/></svg>`;
const editing = () => app.contains(document.activeElement) && document.activeElement.matches("input, textarea, select");

async function load({ background = false } = {}) {
  try {
    const s = await api(`/state?tz=${encodeURIComponent(tz)}`);
    offset = new Date(s.serverNow) - Date.now();
    loadedAt = Date.now();
    state = s;
    signedIn = true;
    if (view === "history") await loadHistoryData();
    // never redraw under someone's fingers: a background refresh would wipe what they are typing
    if (background && editing()) return;
    render();
    maybeForgotten();
  } catch (e) { if (signedIn && !background) toast(e.message); if (!signedIn) render(); }
}

function render() {
  document.body.classList.toggle("out", !signedIn);
  $$(".tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false"));
  if (!signedIn) return renderLogin();
  renderAvatar($("#me"));
  if (view === "track") renderTrack();
  else if (view === "manage") renderManage();
  else renderHistory();
}

function renderAvatar(el) {
  const u = state.user || {};
  const initial = (u.name || u.email || "?").trim()[0].toUpperCase();
  el.innerHTML = u.picture ? `<img src="${esc(u.picture)}" alt="" referrerpolicy="no-referrer">` : esc(initial);
}

/* ---------- login ---------- */
let googleClientId = null;
async function renderLogin() {
  app.innerHTML = `<div class="login">
    <span class="mark">${icon("clock", 34)}</span>
    <h1>Timetrack</h1>
    <p>One tap to start, one tap to stop. See where your hours actually go.</p>
    <div class="demo" aria-hidden="true">
      <div style="--c:#e9a23b"><i></i>Deep work<em class="num">3h 20m</em></div>
      <div style="--c:#3cad8c"><i></i>Exercise<em class="num">45m</em></div>
      <div style="--c:#5b8def"><i></i>Reading<em class="num">1h 05m</em></div>
    </div>
    <div id="gbtn"></div>
    ${canInstall() ? `<button class="linkbtn" id="howinstall">${icon("home", 16)}Add Timetrack to your Home Screen</button>` : ""}
    <p class="fine">Free. Your data is private to your account. <a href="/privacy.html">Privacy</a></p>
  </div>`;
  $("#howinstall")?.addEventListener("click", openInstallGuide);
  try {
    if (googleClientId === null) googleClientId = (await fetch("/config").then((r) => r.json())).googleClientId;
    if (!googleClientId) return toast("Sign-in is not configured on the server");
    await new Promise((ok) => (function wait() { window.google?.accounts?.id ? ok() : setTimeout(wait, 50); })());
    google.accounts.id.initialize({ client_id: googleClientId, callback: onGoogle });
    google.accounts.id.renderButton($("#gbtn"), { theme: isDark() ? "filled_black" : "outline", size: "large", shape: "pill", text: "continue_with" });
  } catch { toast("Could not load Google sign-in"); }
}
async function onGoogle({ credential }) {
  const r = await fetch("/auth/google", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ credential }) });
  if (!r.ok) return toast((await r.json().catch(() => ({}))).error || "Sign-in failed");
  view = "track";
  await load();
  maybeInstallGuide();
}

/* ---------- track ---------- */
// progress of the running session: first toward the usual (average) length, then toward the record
const daysSince = (d) => Math.round((dayStart(new Date()) - dayStart(new Date(d))) / 864e5);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function goalHTML() {
  const st = state.stats, r = state.running;
  if (!st || !r) return "";
  if (state.activities.find((a) => a.id === r.activity_id)?.kind === "limit") return limitGoalHTML(st, r);
  const el = runSec();
  const left = (sec) => (sec < 60 ? `${Math.ceil(sec)}s` : fmtShort(sec + 59));
  const sk = state.streaks?.[r.activity_id];
  const streak = sk?.current >= 2 ? `<span class="streak" title="Best: ${sk.best} days">${sk.current}-day streak</span>` : "";
  if (!st.sessions) {
    return `<div class="gl1"><span>First ${esc(r.name)} session</span>${streak}</div>
      <div class="gsub">Your average and record start from this one.</div>`;
  }
  const facts = `Average ${fmtShort(st.avg)} · Record ${fmtShort(st.max)}`;
  let head, pct, mark = "", cls = "";
  if (el < st.avg) {
    head = `${left(st.avg - el)} to your average`;
    pct = el / st.avg;
  } else if (el < st.max) {
    head = `Past average · ${left(st.max - el)} to your record`;
    pct = el / st.max;
    mark = `<span class="gmark" style="left:${(st.avg / st.max) * 100}%" title="Average"></span>`;
  } else {
    head = "New record!";
    pct = 1;
    cls = "rec";
  }
  const sub = cls ? `Previous best ${fmtShort(st.max)} · ${fmtShort(el - st.max)} longer` : facts;
  return `<div class="gl1 ${cls}"><span>${head}</span>${streak}</div>
    <div class="gbar" role="progressbar" aria-valuenow="${Math.round(pct * 100)}" aria-valuemin="0" aria-valuemax="100">
      <div class="gfill" style="width:${pct * 100}%"></div>${mark}</div>
    <div class="gsub num">${sub}</div>`;
}

// habits to cut back: shorter is better, so warn past the usual length instead of cheering toward a record
function limitGoalHTML(st, r) {
  const el = runSec();
  const left = (sec) => (sec < 60 ? `${Math.ceil(sec)}s` : fmtShort(sec + 59));
  const gap = st.prev_end ? daysSince(st.prev_end) : 0;
  const badge = gap >= 1 ? `<span class="streak">First in ${plural(gap, "day")}</span>` : "";
  if (!st.sessions) {
    return `<div class="gl1"><span>First ${esc(r.name)} session tracked</span>${badge}</div>
      <div class="gsub">Your usual length starts from this one.</div>`;
  }
  let head, pct, mark = "", sub, warn = false;
  if (el < st.avg) {
    head = `${left(st.avg - el)} until your usual ${fmtShort(st.avg)}`;
    pct = el / st.avg;
    sub = "Stop before then to beat your average";
  } else if (el < st.max) {
    head = `Over your usual by ${fmtShort(el - st.avg) === "0m" ? "under 1m" : fmtShort(el - st.avg)}`;
    pct = el / st.max;
    mark = `<span class="gmark" style="left:${(st.avg / st.max) * 100}%" title="Usual"></span>`;
    sub = `Longest so far ${fmtShort(st.max)}`;
    warn = true;
  } else {
    head = "Longest session so far";
    pct = 1;
    sub = `Previous longest ${fmtShort(st.max)} · ${fmtShort(el - st.max)} longer`;
    warn = true;
  }
  return `<div class="gl1 ${warn ? "warn" : ""}"><span>${warn ? icon("alert", 16) : ""}${head}</span>${badge}</div>
    <div class="gbar" role="progressbar" aria-valuenow="${Math.round(pct * 100)}" aria-valuemin="0" aria-valuemax="100">
      <div class="gfill" style="width:${pct * 100}%"></div>${mark}</div>
    <div class="gsub num">${sub}</div>`;
}

function tileSub(a) {
  const today = total(a.id, "today");
  const g = goalState(a);
  if (a.kind === "limit" && !today && (!g || a.goal_period === "day")) {
    if (!a.last_at) return "Not tracked yet";
    const n = daysSince(a.last_at);
    if (n >= 1) return `${plural(n, "day")} free`;
  }
  if (g) {
    if (g.over) return `Over limit by ${fmtShort(g.v - g.g)}`;
    if (g.done) return `Goal reached · ${fmtShort(g.v)}`;
    return `${fmtShort(g.v)} of ${fmtShort(g.g)} ${periodWord(a.goal_period)}`;
  }
  return `${fmtShort(today)} today`;
}
function tileBar(a) {
  const g = goalState(a);
  if (!g) return "";
  return `<span class="tbar${g.over ? " over" : ""}${g.done ? " done" : ""}" aria-hidden="true"><i style="width:${g.pct * 100}%"></i></span>`;
}

/* ---------- focus mode ---------- */
const focusLeft = () => (state.focus ? (new Date(state.focus.ends) - now()) / 1000 : 0);
function focusHero(f) {
  const work = f.phase === "work", last = f.round >= f.rounds;
  const dots = Array.from({ length: f.rounds }, (_, i) => {
    const n = i + 1;
    const cls = n < f.round || (n === f.round && !work) ? "done" : n === f.round ? "now" : "";
    return `<i class="${cls}"></i>`;
  }).join("");
  return `<section class="hero ${work ? "on" : "paused"} focus" style="--c:${f.color}">
    <div><div class="label"><span class="pulse"></span>${work ? `Focus · round ${f.round} of ${f.rounds}` : `Break · round ${f.round + 1} of ${f.rounds} next`}</div>
      <div class="name">${esc(f.name)}</div></div>
    <div class="row">
      <div><div class="clock num" id="focusclock">${fmt(Math.max(0, focusLeft()))}</div>
        <div class="since">${work ? (last ? "Session ends" : `Break (${f.brk} min)`) : "Focus resumes"} at ${clock(f.ends)}</div></div>
      <span class="hbtns">
        <button class="btn-pause" id="fskip" aria-label="${work ? (last ? "Finish now" : "Skip to break") : "Skip break"}">${icon("skip", 18)}</button>
        <button class="btn-stop" id="fstop">${icon("stop", 16)}${work ? "Stop" : "End"}</button></span>
    </div>
    <div class="rounds" aria-label="Round ${f.round} of ${f.rounds}">${dots}<span>${f.work} min focus · ${f.brk} min break</span></div></section>`;
}
function bindFocusHero() {
  $("#fskip")?.addEventListener("click", async () => {
    try { await api("/focus/skip", { method: "POST" }); await load(); } catch (e) { toast(e.message); }
  });
  $("#fstop")?.addEventListener("click", async () => {
    try { const out = await api("/focus/stop", { method: "POST" }); await load(); notify(); toast(out.message); } catch (e) { toast(e.message); }
  });
}
let advancing = false;
async function advanceFocusNow() {
  if (advancing) return;
  advancing = true;
  try { await api("/focus/advance", { method: "POST" }); await load(); notify(); } catch {}
  setTimeout(() => (advancing = false), 3000);
}
const FOCUS_PRESETS = [[25, 5, 4, "Classic"], [50, 10, 2, "Long"], [90, 15, 1, "Deep"]];
function openFocus() {
  const acts = state.activities.filter((a) => a.kind !== "limit");
  if (!acts.length) return toast("Add an activity first");
  const r = state.running;
  const last = acts.find((a) => a.id === r?.activity_id) || [...acts].sort((a, b) => new Date(b.last_at || 0) - new Date(a.last_at || 0))[0];
  $("#editsheet .sheet").innerHTML = `<div class="grab"></div><h3 tabindex="-1" autofocus>Focus mode</h3>
    <form class="eform" id="focusform">
      <p class="hint" style="margin:0 4px">Work in focused rounds with short breaks in between. Timetrack switches by itself and notifies you; break time isn't counted.</p>
      <label>Activity<select class="field" name="act">${acts.map((a) => `<option value="${a.id}" ${a.id === last.id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select></label>
      <div class="presets">${FOCUS_PRESETS.map(([w, b, n, l], i) => `<button type="button" class="preset" data-i="${i}" aria-pressed="${i === 0}">
        <b>${l}</b><small>${w} min · ${b} min break · ${n}×</small></button>`).join("")}</div>
      <div class="goalrow three">
        <label>Focus (min)<input class="field num" type="number" name="w" min="5" max="180" value="25" inputmode="numeric"></label>
        <label>Break (min)<input class="field num" type="number" name="b" min="1" max="60" value="5" inputmode="numeric"></label>
        <label>Rounds<input class="field num" type="number" name="n" min="1" max="12" value="4" inputmode="numeric"></label>
      </div>
      <p class="edur num" id="ftotal"></p>
      <div class="eactions"><span></span><span></span><button type="button" class="btn ghost" id="fcancel">Cancel</button>
        <button type="submit" class="btn">${icon("target", 16)}Start</button></div>
    </form>`;
  const f = $("#focusform");
  const upd = () => {
    const w = +f.w.value, b = +f.b.value, n = +f.n.value;
    $$(".preset", f).forEach((p) => { const [pw, pb, pn] = FOCUS_PRESETS[p.dataset.i]; p.setAttribute("aria-pressed", pw === w && pb === b && pn === n); });
    $("#ftotal").textContent = w && n ? `${fmtShort(w * n * 60)} of focus, done at ${clock(now() + (w * n + b * (n - 1)) * 60e3)}` : "";
  };
  $$(".preset", f).forEach((p) => p.onclick = () => { const [w, b, n] = FOCUS_PRESETS[p.dataset.i]; f.w.value = w; f.b.value = b; f.n.value = n; upd(); });
  f.oninput = upd; upd();
  $("#fcancel").onclick = () => editSheet.close();
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    try {
      const out = await api("/focus", { method: "POST", body: { activity_id: Number(f.act.value), work: +f.w.value, brk: +f.b.value, rounds: +f.n.value } });
      editSheet.close();
      await load();
      notify();
      toast(out.message);
    } catch (e) { toast(e.message); }
  };
  editSheet.showModal();
}

/* ---------- starter setup (new users) ---------- */
const STARTERS = [
  ["Work", "good", 2400, "week"], ["Deep work", "good", 120, "day"], ["Study", "good", 60, "day"], ["Exercise", "good", 180, "week"],
  ["Reading", "good", 30, "day"], ["Walking", "good", 30, "day"], ["Meditation", "good", 10, "day"], ["Language learning", "good", 20, "day"],
  ["Housework", "good", null, null], ["Social media", "limit", 30, "day"], ["Gaming", "limit", 60, "day"], ["TV & streaming", "limit", 90, "day"],
];
function starterHTML() {
  const row = ([name, kind, m, p], i) => `<button type="button" class="nrow" data-starter="${i}" aria-pressed="false"><span class="box" aria-hidden="true"></span>
    <span><b>${name}</b><small>${m ? `${kind === "limit" ? "Limit" : "Goal"} ${fmtShort(m * 60)} / ${p}` : "No goal"}</small></span></button>`;
  return `<section class="card starter">
    <h2>Let's set up your activities</h2>
    <p class="hint" style="margin:0">Pick what you'd like to track. Goals and limits are suggestions; change them any time under Activities.</p>
    <div class="label">Things to do more of</div>
    <div class="nprefs">${STARTERS.map((t, i) => (t[1] === "good" ? row(t, i) : "")).join("")}</div>
    <div class="label">Habits to cut back</div>
    <div class="nprefs">${STARTERS.map((t, i) => (t[1] === "limit" ? row(t, i) : "")).join("")}</div>
    <button class="btn" id="starterbtn" disabled>Pick at least one</button>
    <button class="linkbtn" id="goadd">${icon("plus", 14)}Or create your own</button></section>`;
}
function bindStarter() {
  const btn = $("#starterbtn");
  if (!btn) return;
  const picked = () => $$("[data-starter][aria-pressed='true']").map((b) => STARTERS[b.dataset.starter]);
  $$("[data-starter]").forEach((b) => b.onclick = () => {
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true");
    const n = picked().length;
    btn.disabled = !n;
    btn.textContent = n ? `Add ${n} ${n === 1 ? "activity" : "activities"}` : "Pick at least one";
  });
  btn.onclick = async () => {
    const list = picked();
    btn.disabled = true;
    btn.textContent = "Adding…";
    try {
      for (const [i, [name, kind, m, p]] of list.entries()) {
        await api("/activities", { method: "POST", body: { name, kind, color: PALETTE[i % PALETTE.length], ...(m ? { goal_minutes: m, goal_period: p } : {}) } });
      }
      await load();
      toast(`Added ${list.length}. Tap one to start its timer`);
    } catch (e) { toast(e.message); await load(); }
  };
}

/* ---------- breaks ---------- */
const pauseLeft = () => (state.pause ? (new Date(state.pause.until) - now()) / 1000 : 0);
function pausedHero(p) {
  return `<section class="hero paused" style="--c:${p.color}">
    <div><div class="label"><span class="pulse"></span>On a break</div><div class="name">${esc(p.name)}</div></div>
    <div class="row">
      <div><div class="clock num" id="pauseclock">${fmt(Math.max(0, pauseLeft()))}</div><div class="since">Continues at ${clock(p.until)}</div></div>
      <button class="btn-stop" id="resumenow">${icon("play", 16)}Resume</button>
    </div>
    <button class="linkbtn endbreak" id="endbreak">End the session instead</button></section>`;
}
function openPause() {
  const r = state.running;
  if (!r) return;
  $("#editsheet .sheet").innerHTML = `<div class="grab"></div><h3 tabindex="-1" autofocus>Take a break</h3>
    <form class="eform" id="pauseform">
      <p class="hint" style="margin:0 4px">${esc(r.name)} stops now and starts again when the break is over. You'll get a notification.</p>
      <div class="pchoices">${[5, 10, 15, 30, 60].map((m) => `<button type="button" class="pchoice" data-m="${m}">${m} min</button>`).join("")}</div>
      <label>Or minutes<input class="field num" type="number" name="m" min="1" max="240" placeholder="e.g. 20" inputmode="numeric"></label>
      <div class="eactions"><span></span><span></span><button type="button" class="btn ghost" id="pcancel">Cancel</button><button type="submit" class="btn">Start break</button></div>
    </form>`;
  const f = $("#pauseform");
  const go = async (minutes) => {
    if (!(minutes >= 1 && minutes <= 240)) return toast("Pick 1 to 240 minutes");
    try {
      const out = await api("/pause", { method: "POST", body: { minutes } });
      editSheet.close();
      await stopNotify();
      await load();
      toast(out.message);
    } catch (e) { toast(e.message); }
  };
  $$(".pchoice", f).forEach((b) => b.onclick = () => go(Number(b.dataset.m)));
  f.onsubmit = (ev) => { ev.preventDefault(); go(Number(f.m.value)); };
  $("#pcancel").onclick = () => editSheet.close();
  editSheet.showModal();
}
let resuming = false;
async function resumeBreak(auto) {
  if (resuming) return;
  resuming = true;
  try {
    const out = await api("/pause/resume", { method: "POST" });
    await load();
    notify();
    toast(auto === true ? `Break over · ${state.running?.name || "timer"} continues` : out.message);
  } catch (e) { toast(e.message); }
  resuming = false;
}

// When nothing is running: a one-tap way back into the last activity, and where today's goals stand.
function idleHero(acts) {
  if (!acts.length) {
    return `<section class="hero idle"><div class="label">Nothing running</div>
      <div class="since">Add an activity to get started</div></section>`;
  }
  // last thing you did, skipping habits you're cutting back on
  const last = acts.filter((a) => a.kind !== "limit" && a.last_at).sort((a, b) => new Date(b.last_at) - new Date(a.last_at))[0];
  const ago = last ? fmtShort((now() - new Date(last.last_at)) / 1000) : "";
  const resume = last
    ? `<button class="resume" id="resume" data-id="${last.id}" style="--c:${last.color}">
        <span class="rplay">${icon("play", 16)}</span>
        <span><b>Continue ${esc(last.name)}</b><small>${ago === "0m" ? "stopped just now" : `stopped ${ago} ago`}</small></span></button>`
    : `<div class="since">Tap an activity below to start the clock</div>`;

  const withGoals = acts.filter((a) => a.goal_minutes).map((a) => ({ a, g: goalState(a) }));
  // unfinished goals first, then limits (closest to the limit first), finished goals last
  const rank = ({ a, g }) => (a.kind === "limit" ? (g.over ? 0 : 1) + (1 - g.pct) : g.done ? 3 : 0.5 - g.pct);
  withGoals.sort((x, y) => rank(x) - rank(y));
  const rows = withGoals.slice(0, 5).map(({ a, g }) => {
    const when = periodWord(a.goal_period);
    let text, cls = "";
    if (a.kind === "limit") {
      if (g.over) { text = `Over by ${fmtShort(g.v - g.g)}`; cls = "warn"; }
      else text = `${fmtShort(g.g - g.v)} left of ${fmtShort(g.g)} ${when}`;
    } else if (g.done) { text = `Done · ${fmtShort(g.v)} ${when}`; cls = "done"; }
    else text = `${fmtShort(g.v)} of ${fmtShort(g.g)} ${when}`;
    return `<div class="grow" style="--c:${a.color}">
      <span class="gname"><i></i>${esc(a.name)}</span><span class="gval num ${cls}">${text}</span>
      <span class="gtrack${g.over ? " over" : ""}"><span style="width:${g.pct * 100}%"></span></span></div>`;
  }).join("");
  const goals = withGoals.length
    ? `<div class="glist"><div class="label">Goals</div>${rows}</div>`
    : `<button class="linkbtn setgoals" id="setgoals">${icon("flag", 14)}Set daily or weekly goals</button>`;

  return `<section class="hero idle"><div class="label">Nothing running</div>${resume}${goals}
    <button class="linkbtn" id="startfocus">${icon("target", 14)}Start a focus session</button></section>`;
}

// "5-day streak · best 12"; for cut-back habits with a daily limit, days stayed under it
function streakLine(a) {
  const sk = state.streaks?.[a.id];
  if (!sk || sk.current < 2) return "";
  if (a.kind === "limit" && !(a.goal_minutes && a.goal_period === "day")) return ""; // the tile already says "N days free"
  const what = a.kind === "limit" ? `${sk.current} days under limit` : `${sk.current}-day streak`;
  return `<div class="streakl num">${icon("bolt", 12)}${what}${sk.best > sk.current ? ` · best ${sk.best}` : ""}</div>`;
}

function renderTrack() {
  const r = state.running;
  const acts = state.activities;
  const runAct = r && acts.find((a) => a.id === r.activity_id);

  const hero = state.focus ? focusHero(state.focus) : r
    ? `<section class="hero on" style="--c:${runAct?.color || "var(--accent)"}">
        <div><div class="label"><span class="pulse"></span>Tracking now</div>
        <div class="name">${esc(r.name)}</div></div>
        <div class="row">
          <div><div class="clock num" id="clock">${fmt(runSec())}</div><div class="since">Started ${clock(r.started_at)}</div></div>
          <span class="hbtns"><button class="btn-pause" id="focusbtn" aria-label="Focus mode">${icon("target", 18)}</button>
          <button class="btn-pause" id="pausebtn" aria-label="Take a break">${icon("pause", 18)}</button>
          <button class="btn-stop" id="stopbtn">${icon("stop", 16)}Stop</button></span>
        </div>
        <div class="goal" id="goal">${goalHTML()}</div>

    : state.pause ? pausedHero(state.pause) : idleHero(acts);

  const list = acts.length
    ? `<h2 class="section"><span>Activities</span><span></span></h2>
       <div class="grid">${acts.map((a) => {
         const on = r && r.activity_id === a.id;
         return `<button class="tile ${on ? "on" : ""}" data-id="${a.id}" style="--c:${a.color}" aria-pressed="${!!on}">
           <span class="play">${icon(on ? "stop" : "play", 14)}</span>
           <span class="top-l"><span class="dot"></span>${a.kind === "limit" ? `<span class="kindtag">Cut back</span>` : ""}</span>
           <span><div class="nm">${esc(a.name)}</div>
           <div class="sub num${goalState(a)?.over ? " warn" : ""}" data-sub="${a.id}">${on ? fmt(runSec()) : tileSub(a)}</div>
           ${streakLine(a)}</span>
           ${tileBar(a)}
         </button>`;
       }).join("")}</div>`
    : starterHTML();

  app.innerHTML = (acts.length || state.focus || r ? hero : "") + list;
  if (r) $("#stopbtn").onclick = stop;
  $("#pausebtn")?.addEventListener("click", openPause);
  $("#focusbtn")?.addEventListener("click", () => openFocus());
  $("#startfocus")?.addEventListener("click", () => openFocus());
  bindFocusHero();
  bindStarter();
  $("#resumenow")?.addEventListener("click", resumeBreak);
  $("#endbreak")?.addEventListener("click", async () => {
    try { await api("/pause/cancel", { method: "POST" }); await load(); toast("Session ended"); } catch (e) { toast(e.message); }
  });
  bindLiveGoal(runAct);
  $("#goadd")?.addEventListener("click", () => go("manage", true));
  $("#resume")?.addEventListener("click", (e) => start(Number(e.currentTarget.dataset.id)));
  $("#setgoals")?.addEventListener("click", () => go("manage"));
  $$(".tile").forEach((b) => b.onclick = () => (r && r.activity_id == b.dataset.id) ? stop() : start(Number(b.dataset.id)));
}

async function start(id) {
  try { await api("/start", { method: "POST", body: { activity_id: id } }); await load(); notify(); }
  catch (e) { toast(e.message); }
}
async function stop() {
  try { await api("/stop", { method: "POST" }); await load(); notify(); }
  catch (e) { toast(e.message); }
}

/* ---------- history ---------- */
const DAYS = 14;
const dayStart = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const entryEnd = (e) => (e.stopped_at ? new Date(e.stopped_at).getTime() : now());
const dur = (e) => (entryEnd(e) - new Date(e.started_at)) / 1000;
const parseDay = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

let summary = { week: null, month: null };
let searchQ = "", searchResults = null;
const CHART_MODES = [["days", "Days"], ["weeks", "Weeks"], ["months", "Months"], ["timeline", "Timeline"]];
let chartMode = "days";
try {
  const saved = localStorage.getItem("chartMode") || (localStorage.getItem("dailyMode") === "timeline" ? "timeline" : "");
  if (CHART_MODES.some(([m]) => m === saved)) chartMode = saved;
} catch {}

let dayLoadedAt = 0;
async function loadHistoryData() {
  // the year of days for the heatmap changes slowly; refresh it at most every 5 minutes
  if (Date.now() - dayLoadedAt > 5 * 60e3) {
    dayLoadedAt = Date.now();
    api(`/summary?bucket=day&count=371&tz=${encodeURIComponent(tz)}`).then((d) => { summary.day = d; if (view === "history" && !editing()) renderHistory(); })
      .catch(() => (dayLoadedAt = 0));
  }
  const jobs = [api("/entries?days=14"), api(`/summary?bucket=week&count=12&tz=${encodeURIComponent(tz)}`)];
  if (chartMode === "months") jobs.push(api(`/summary?bucket=month&count=12&tz=${encodeURIComponent(tz)}`));
  const [e, w, m] = await Promise.all(jobs);
  entries = e; summary.week = w; if (m) summary.month = m;
}

// seconds per activity per calendar day, splitting entries that cross midnight
function dailyTotals() {
  const first = addDays(dayStart(new Date()), -(DAYS - 1));
  const days = Array.from({ length: DAYS }, (_, i) => ({ date: addDays(first, i), by: new Map(), total: 0 }));
  for (const e of entries) {
    const s = new Date(e.started_at).getTime(), end = entryEnd(e);
    for (const d of days) {
      const a = d.date.getTime(), b = addDays(d.date, 1).getTime();
      const v = (Math.min(end, b) - Math.max(s, a)) / 1000;
      if (v > 0) { d.by.set(e.activity_id, (d.by.get(e.activity_id) || 0) + v); d.total += v; }
    }
  }
  return days;
}

// activities in the user's own order (archived ones last), limited to those with data
function orderSeries(list) {
  const order = state.activities.map((a) => a.id);
  const rank = (id) => (order.includes(id) ? order.indexOf(id) : 1e6 + id);
  return list.map((s) => ({ ...s, ...(state.activities.find((a) => a.id === s.id) || {}) })).sort((a, b) => rank(a.id) - rank(b.id));
}
function chartSeries() {
  const seen = new Map();
  for (const e of entries) if (!seen.has(e.activity_id)) seen.set(e.activity_id, { id: e.activity_id, name: e.name, color: e.color });
  return orderSeries([...seen.values()]);
}

// columns for the bar chart: { by, total, current, top, bottom, title }
function chartData(mode) {
  if (mode === "days") {
    const todayKey = dayStart(new Date()).getTime();
    return {
      unit: "day", series: chartSeries(),
      cols: dailyTotals().map((d) => ({
        ...d, current: d.date.getTime() === todayKey,
        top: d.date.toLocaleDateString(undefined, { weekday: "narrow" }), bottom: d.date.getDate(),
        title: d.date.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }),
      })),
    };
  }
  const sm = summary[mode === "weeks" ? "week" : "month"];
  if (!sm) return null;
  const cols = sm.buckets.map((b, i) => {
    const date = parseDay(b), prev = i ? parseDay(sm.buckets[i - 1]) : null;
    const newMonth = !prev || prev.getMonth() !== date.getMonth();
    return mode === "weeks"
      ? { key: b, by: new Map(), total: 0, current: i === sm.buckets.length - 1,
          top: newMonth ? date.toLocaleDateString(undefined, { month: "short" }) : "", bottom: date.getDate(),
          title: `Week of ${date.toLocaleDateString(undefined, { day: "numeric", month: "short" })}` }
      : { key: b, by: new Map(), total: 0, current: i === sm.buckets.length - 1,
          top: date.toLocaleDateString(undefined, { month: "narrow" }),
          bottom: !prev || date.getMonth() === 0 ? String(date.getFullYear()).slice(2) : "",
          title: date.toLocaleDateString(undefined, { month: "long", year: "numeric" }) };
  });
  const idx = new Map(sm.buckets.map((b, i) => [b, i]));
  const seen = new Set();
  for (const r of sm.rows) {
    const c = cols[idx.get(r.bucket)];
    if (!c) continue;
    c.by.set(r.activity_id, (c.by.get(r.activity_id) || 0) + r.seconds);
    c.total += r.seconds;
    seen.add(r.activity_id);
  }
  const series = orderSeries(sm.activities.filter((a) => seen.has(a.id)).map((a) => ({ id: a.id, name: a.name, color: a.color })));
  return { unit: mode === "weeks" ? "week" : "month", series, cols };
}

function niceStepHours(maxH) {
  for (const s of [0.5, 1, 2, 3, 4, 6, 8, 12, 24, 48, 96, 168, 336]) if (maxH / s <= 4) return s;
  return 720;
}

let chartCols = [], chartSeriesList = [];
function renderBars({ cols, series }) {
  const maxH = Math.max(1, ...cols.map((d) => d.total / 3600));
  const step = niceStepHours(maxH);
  const top = Math.ceil(maxH / step) * step;
  const H = 150;
  const ticks = [];
  for (let t = 0; t <= top + 1e-9; t += step) ticks.push(t);
  chartCols = cols; chartSeriesList = series;
  const bars = cols.map((d, i) => {
    const segs = series.filter((s) => d.by.get(s.id) > 0)
      .map((s) => `<span style="--c:${s.color};height:${(d.by.get(s.id) / 3600 / top) * H}px"></span>`).join("");
    return `<button class="col${d.current ? " today" : ""}" data-col="${i}" aria-label="${esc(d.title)}: ${fmtShort(d.total)}">
      <span class="stack" style="height:${H}px">${segs ? `<span class="segs">${segs}</span>` : ""}</span>
      <span class="xl"><b>${d.top || "&nbsp;"}</b>${d.bottom || "&nbsp;"}</span></button>`;
  }).join("");
  const grid = ticks.map((t) => `<div class="gl" style="bottom:${(t / top) * H}px"><span>${t ? (t % 1 ? `${t * 60}m` : `${t}h`) : ""}</span></div>`).join("");
  return `<div class="plot" style="height:${H}px">${grid}<div class="cols" style="grid-template-columns:repeat(${cols.length},1fr)">${bars}</div></div>`;
}

function renderChartCard() {
  const toggle = `<div class="seg" role="tablist" aria-label="Chart view">${CHART_MODES.map(([m, label]) =>
    `<button role="tab" data-mode="${m}" aria-selected="${chartMode === m}">${label}</button>`).join("")}</div>`;
  const data = chartData(chartMode === "timeline" ? "days" : chartMode);
  let body, avgText = "";
  if (!data) {
    body = `<div class="empty" style="box-shadow:none">Loading…</div>`;
  } else {
    const active = data.cols.filter((c) => c.total > 0);
    const avg = active.length ? active.reduce((s, c) => s + c.total, 0) / active.length : 0;
    if (avg) avgText = `avg ${fmtShort(avg)} / ${data.unit}`;
    body = chartMode === "timeline" ? renderTimeline(data.cols) : renderBars(data);
  }
  const legend = (data?.series || []).map((s) => `<span class="lg" style="--c:${s.color}"><i></i>${esc(s.name)}</span>`).join("");
  return `<h2 class="section"><span>Overview</span><span class="num">${avgText}</span></h2>
    <div class="card chart">${toggle}${body}${legend ? `<div class="legend">${legend}</div>` : ""}<div class="tip" id="tip" hidden></div></div>`;
}

// one row per day, 00:00 on the left to 24:00 on the right, so the same clock time lines up across days
function renderTimeline(days) {
  const todayKey = dayStart(new Date()).getTime();
  const rows = [...days].reverse().map((d) => {
    const a = d.date.getTime(), b = addDays(d.date, 1).getTime(), span = b - a;
    const blocks = entries.map((e) => {
      const s = Math.max(new Date(e.started_at).getTime(), a), t = Math.min(entryEnd(e), b);
      if (t <= s) return "";
      const title = `${e.name} ${clock(e.started_at)}–${e.stopped_at ? clock(e.stopped_at) : "now"} (${fmtShort(dur(e))})${e.note ? " · " + e.note : ""}`;
      return `<button class="blk" data-entry="${e.id}" style="--c:${e.color};left:${((s - a) / span) * 100}%;width:${((t - s) / span) * 100}%" title="${esc(title)}" aria-label="${esc(title)}"></button>`;
    }).join("");
    const isToday = a === todayKey;
    const nowMark = isToday ? `<span class="tl-now" style="left:${((now() - a) / span) * 100}%"></span>` : "";
    return `<div class="tl-row${isToday ? " today" : ""}">
      <span class="tl-d num">${d.date.toLocaleDateString(undefined, { weekday: "short" })} ${d.date.getDate()}</span>
      <div class="tl-track">${blocks}${nowMark}</div></div>`;
  }).join("");
  const axis = [0, 6, 12, 18, 24].map((h) => `<span style="left:${(h / 24) * 100}%">${String(h).padStart(2, "0")}</span>`).join("");
  return `<div class="tl">${rows}<div class="tl-row axis"><span class="tl-d"></span><div class="tl-axis num">${axis}</div></div></div>`;
}

function bindChart() {
  $$(".seg button").forEach((b) => b.onclick = async () => {
    chartMode = b.dataset.mode;
    try { localStorage.setItem("chartMode", chartMode); } catch {}
    renderHistory();
    if (chartMode === "months" && !summary.month) {
      try { summary.month = await api(`/summary?bucket=month&count=12&tz=${encodeURIComponent(tz)}`); renderHistory(); }
      catch (e) { toast(e.message); }
    }
  });
  const tip = $("#tip"), chart = $(".chart");
  if (!tip || chartMode === "timeline") return;
  let pinned = null;
  const show = (btn) => {
    const d = chartCols[btn.dataset.col];
    const rows = chartSeriesList.filter((s) => d.by.get(s.id) > 0).reverse()
      .map((s) => `<div class="tr" style="--c:${s.color}"><i></i><span>${esc(s.name)}</span><b class="num">${fmtShort(d.by.get(s.id))}</b></div>`).join("");
    tip.innerHTML = `<div class="th"><span>${esc(d.title)}</span><b class="num">${fmtShort(d.total)}</b></div>${rows || `<div class="tr muted">Nothing tracked</div>`}`;
    tip.hidden = false;
    $$(".col", chart).forEach((c) => c.classList.toggle("sel", c === btn));
    const cr = chart.getBoundingClientRect(), br = btn.getBoundingClientRect();
    const w = tip.offsetWidth;
    tip.style.left = `${Math.min(Math.max(br.left - cr.left + br.width / 2 - w / 2, 8), cr.width - w - 8)}px`;
  };
  const hide = () => { tip.hidden = true; $$(".col", chart).forEach((c) => c.classList.remove("sel")); };
  $$(".col", chart).forEach((btn) => {
    btn.onpointerenter = (e) => { if (e.pointerType === "mouse" && !pinned) show(btn); };
    btn.onpointerleave = (e) => { if (e.pointerType === "mouse" && !pinned) hide(); };
    btn.onclick = () => { if (pinned === btn) { pinned = null; hide(); } else { pinned = btn; show(btn); } };
  });
}

// this week per activity, with the change from last week; "better" depends on whether it's a habit to cut back
function renderCompare() {
  const sm = summary.week;
  if (!sm || sm.buckets.length < 2) return "";
  const [prevKey, curKey] = sm.buckets.slice(-2);
  const cur = new Map(), prev = new Map();
  for (const r of sm.rows) {
    if (r.bucket === curKey) cur.set(r.activity_id, (cur.get(r.activity_id) || 0) + r.seconds);
    if (r.bucket === prevKey) prev.set(r.activity_id, (prev.get(r.activity_id) || 0) + r.seconds);
  }
  const acts = sm.activities.filter((a) => (cur.get(a.id) || 0) > 0 || (!a.archived && (prev.get(a.id) || 0) > 0))
    .map((a) => ({ ...a, v: cur.get(a.id) || 0, p: prev.get(a.id) || 0 })).sort((a, b) => b.v - a.v || b.p - a.p);
  const totalCur = [...cur.values()].reduce((s, v) => s + v, 0);
  const max = Math.max(1, ...acts.map((a) => Math.max(a.v, a.p)));
  const rows = acts.map((a) => {
    const diff = a.v - a.p;
    let delta, cls = "";
    if (Math.abs(diff) < 60) delta = "same as last week";
    else if (!a.p) delta = "new this week";
    else {
      const up = diff > 0;
      cls = (up === (a.kind !== "limit")) ? "better" : "worse";
      delta = `${up ? "▲" : "▼"} ${fmtShort(Math.abs(diff))} vs last week`;
    }
    return `<div style="--c:${a.color}">
      <div class="l"><span>${esc(a.name)}${a.kind === "limit" ? ` <span class="kindtag">Cut back</span>` : ""}</span><span class="num">${fmtShort(a.v)}</span></div>
      <div class="track"><div class="fill" style="width:${(a.v / max) * 100}%"></div><div class="prev" style="left:${(a.p / max) * 100}%" title="Last week"></div></div>
      <div class="delta num ${cls}">${delta}</div></div>`;
  }).join("");
  return `<h2 class="section"><span>This week vs last</span><span class="num">${fmtShort(totalCur)}</span></h2>
    ${acts.length ? `<div class="card wk">${rows}</div><p class="hint">The thin mark on each bar is last week's total.</p>` : `<div class="empty">Nothing tracked this week or last.</div>`}`;
}

function reviewCard() {
  const sm = summary.week;
  const cur = sm ? sm.rows.filter((r) => r.bucket === sm.buckets[sm.buckets.length - 1]).reduce((x, r) => x + r.seconds, 0) : 0;
  return `<button class="reviewcard" id="openreview">${icon("chart", 20)}<span><b>Weekly review</b>
    <small>${cur ? `This week so far · ${fmtShort(cur)}` : "Your week in numbers"}</small></span><span class="chev">›</span></button>`;
}

// ---------- calendar heatmap: a year of days, darker = more time ----------
let heatFilter = "all";
function renderHeatmap() {
  const sm = summary.day;
  if (!sm) return `<h2 class="section"><span>Year</span></h2><div class="empty">Loading…</div>`;
  const seen = new Set(sm.rows.map((r) => r.activity_id));
  const acts = sm.activities.filter((a) => seen.has(a.id));
  if (heatFilter !== "all" && !acts.some((a) => a.id == heatFilter)) heatFilter = "all";
  const act = acts.find((a) => a.id == heatFilter);
  const byDay = new Map();
  for (const r of sm.rows) if (heatFilter === "all" || r.activity_id == heatFilter) byDay.set(r.bucket, (byDay.get(r.bucket) || 0) + r.seconds);
  const max = Math.max(1, ...byDay.values());
  const level = (v) => (v < 60 ? 0 : Math.min(4, Math.ceil((v / max) * 4)));
  const dates = sm.buckets;
  const pad = (parseDay(dates[0]).getDay() + 6) % 7; // weeks start on Monday
  const cells = [...Array(pad).fill(null), ...dates];
  const weeks = Math.ceil(cells.length / 7);
  let months = "", prevMonth = -1;
  for (let w = 0; w < weeks; w++) {
    const d = cells.slice(w * 7, w * 7 + 7).find(Boolean);
    const m = d ? parseDay(d).getMonth() : prevMonth;
    months += `<span>${m !== prevMonth && w < weeks - 1 ? parseDay(d).toLocaleDateString(undefined, { month: "short" }) : ""}</span>`;
    prevMonth = m;
  }
  const grid = cells.map((d) => d
    ? `<i class="l${level(byDay.get(d) || 0)}" data-d="${d}" title="${esc(parseDay(d).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }))}: ${fmtShort(byDay.get(d) || 0)}"></i>`
    : "<i class=\"pad\"></i>").join("");
  // days tracked and longest run of consecutive tracked days
  let tracked = 0, run = 0, best = 0;
  for (const d of dates) { if ((byDay.get(d) || 0) >= 60) { tracked++; run++; best = Math.max(best, run); } else run = 0; }
  const chips = [`<button type="button" class="hchip" data-h="all" aria-pressed="${heatFilter === "all"}">All</button>`,
    ...acts.map((a) => `<button type="button" class="hchip" data-h="${a.id}" style="--c:${a.color}" aria-pressed="${heatFilter == a.id}"><i></i>${esc(a.name)}</button>`)].join("");
  return `<h2 class="section"><span>Year</span><span class="num">${tracked} days tracked</span></h2>
    <div class="card heat" style="--c:${act ? act.color : "var(--accent)"}">
      <div class="hchips">${chips}</div>
      <div class="hscroll" id="hscroll"><div class="hwrap">
        <div class="hdays"><span></span><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span></div>
        <div><div class="hmonths" style="grid-template-columns:repeat(${weeks}, var(--cell))">${months}</div>
        <div class="hgrid">${grid}</div></div></div></div>
      <div class="hfoot"><span id="hinfo" class="num">${best >= 2 ? `Longest streak: ${best} days` : "Tap a day for its total"}</span>
        <span class="hlegend">Less <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> More</span></div>
    </div>`;
}

  if (sc) sc.scrollLeft = sc.scrollWidth; // most recent weeks first in view
  $$(".hchip").forEach((b) => b.onclick = () => { heatFilter = b.dataset.h; renderHistory(); });
  $$(".hgrid i[data-d]").forEach((c) => c.onclick = () => {

// ---------- weekly review ----------
async function openReview(start) {
  sheet.close();

  try { r = await api(`/review?tz=${encodeURIComponent(tz)}${start ? `&start=${start}` : ""}`); } catch (e) { return toast(e.message); }
  const shift = (d, n) => { const x = parseDay(d); x.setDate(x.getDate() + n); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };

    if (!p && !v) return "";

    const d = v - p;

    return `<span class="delta ${(d > 0) === !limit ? "better" : "worse"}">${d > 0 ? "▲" : "▼"} ${fmtShort(Math.abs(d))}</span>`;
  };

    return `<div class="rvrow" style="--c:${a.color}"><span class="rvname"><i></i>${esc(a.name)}<small>${target}</small></span>
      <span class="rvval ${ok ? "better" : g.period === "day" && g.daysMet ? "" : "worse"}">${ok ? icon("check", 14) : ""}${text}</span></div>`;
  };
  const topStreak = Object.entries(state.streaks || {}).map(([id, s]) => ({ a: state.activities.find((x) => x.id == id), ...s }))

  $("#editsheet .sheet").innerHTML = `<div class="grab"></div>
    <div class="rvhead"><button type="button" class="icon-btn" id="rvprev" aria-label="Previous week">${icon("up", 18)}</button>

      <button type="button" class="icon-btn" id="rvnext" aria-label="Next week" ${r.current ? "disabled" : ""}>${icon("down", 18)}</button></div>
    <div class="eform review">
      <div class="rvtotal"><b class="num">${fmtShort(r.total)}</b>${r.prevTotal ? `<span class="delta ${diff >= 0 ? "better" : ""}">${diff >= 0 ? "▲" : "▼"} ${fmtShort(Math.abs(diff))} vs the week before</span>` : "<span class=\"delta\">tracked</span>"}</div>
      <div class="rvdays">${r.days.map((d) => `<span title="${fmtShort(d.seconds)}"><i style="height:${Math.max(d.seconds ? 4 : 0, (d.seconds / maxDay) * 56)}px"></i>
        <small>${fmtD(d.date, { weekday: "narrow" })}</small></span>`).join("")}</div>
      <div class="rvfacts">
        <span><b class="num">${r.daysTracked}</b> of ${r.daysElapsed} days tracked</span>
        ${r.bestDay ? `<span>Best day <b>${fmtD(r.bestDay.date, { weekday: "long" })}</b> · ${fmtShort(r.bestDay.seconds)}</span>` : ""}
        ${topStreak ? `<span>Streak going: <b>${esc(topStreak.a.name)}</b> ${topStreak.current} days${topStreak.a.kind === "limit" ? " under limit" : ""}</span>` : ""}
      </div>
      ${r.activities.some((a) => a.seconds) ? `<div class="label">Activities</div>${r.activities.filter((a) => a.seconds || a.prev).map((a) => `
        <div class="rvrow" style="--c:${a.color}"><span class="rvname"><i></i>${esc(a.name)}</span>
        <span class="rvval num">${fmtShort(a.seconds)} ${delta(a.seconds, a.prev, a.kind === "limit")}</span></div>`).join("")}` : `<p class="hint">Nothing tracked this week.</p>`}

    </div>`;
  $("#rvprev").onclick = () => openReview(shift(r.start, -7));

  if (!editSheet.open) editSheet.showModal();
}

const findEntry = (id) => (searchResults || []).concat(entries).find((e) => e.id == id);

function renderEntryList() {
  const list = searchResults ?? entries;
  const box = $("#entrylist");
  if (!box) return;

  }
  const days = new Map();
  for (const e of list) {
    const key = new Date(e.started_at).toDateString();
    if (!days.has(key)) days.set(key, []);

  for (const [key, items] of days) {

    html += `<div class="day"><b>${label}</b><span class="num">${fmtShort(items.reduce((s, e) => s + dur(e), 0))}</span></div><div class="card">`;
    html += items.map((e) => `<div class="swipe">${e.stopped_at ? `<div class="swipe-bg" aria-hidden="true"><span>${icon("trash", 16)}Delete</span><span>Delete${icon("trash", 16)}</span></div>` : ""}
        <button class="rowi entry" data-entry="${e.id}" style="--c:${e.color}" aria-label="Edit ${esc(e.name)} entry">
        <span class="bar"></span>
        <span><div>${esc(e.name)}</div><div class="t num">${clock(e.started_at)} – ${e.stopped_at ? clock(e.stopped_at) : "now"}</div>
        ${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}</span>
        <span class="right"><span class="d num">${fmtShort(dur(e))}</span><span class="chev">${icon("edit", 16)}</span></span></button></div>`).join("");
    html += `</div>`;
  }
